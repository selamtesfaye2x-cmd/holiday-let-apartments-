    href="style.css"

  href="index.html"
  class="logo"
>

</a>


<nav>

  <a href="index.html">
    Home
  </a>

  <a href="properties.html">
    Properties

  </header>  <!-- REGISTER FORM -->  <main class="form-page"><div class="form-card">

  <p class="eyebrow">
    CREATE ACCOUNT
  </p>

  <h1>
    List your property on StayHaven
  </h1>

  <p class="intro">
    Create an owner account to manage your properties
    and booking requests.
  </p>


  <form id="registerForm">

    <div class="form-group">

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        required
        placeholder="Your full name"
      >

    </div>


    <div class="form-group">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        required
        placeholder="you@example.com"
      >

    </div>


    <div class="form-group">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        required
        minlength="6"
        placeholder="At least 6 characters"
      >

    </div>


    <button
      type="submit"
      id="registerButton"
      class="submit-button"
    >
      Create Account
    </button>

  </form>


  <div
    id="message"
    class="message"
  ></div>


  <p
    style="margin-top:20px; color:#667085;"
  >
    Already have an account?

    <a
      href="login.html"
      style="font-weight:700; color:#b88945;"
    >
      Login
    </a>

  </p>

</div>

  </main>  <!-- SCRIPTS -->  <script src="supabase.js"></script>  <script>

    const registerForm =
      document.getElementById(
        "registerForm"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        registerButton.disabled =
          true;

        registerButton.textContent =
          "Creating account...";


        message.className =
          "message";


        try {

          const fullName =
            document
              .getElementById("fullName")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signUp({

                email:
                  email,

                password:
                  password,

                options: {

                  data: {

                    full_name:
                      fullName

                  }

                }

              });


          if (error) {

            throw error;

          }


          message.textContent =
            "Account created successfully!";


          message.className =
            "message success";


          /*
             If Supabase automatically logs
             the user in, go to dashboard.
          */

          if (
            data.session
          ) {

            setTimeout(
              function() {

                window.location.href =
                  "dashboard.html";

              },
              800
            );

          }

          else {

            message.textContent =
              "Account created! Please check your email to confirm your account, then log in.";

          }

        }


        catch (error) {

          console.error(
            "REGISTER ERROR:",
            error
          );


          message.textContent =
            error.message ||
            "Unable to create account.";


          message.className =
            "message error";

        }


        finally {

          registerButton.disabled =
            false;

          registerButton.textContent =
            "Create Account";

        }

      }
    );

  </script></body></html>
