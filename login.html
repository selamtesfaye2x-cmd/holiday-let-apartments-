<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login | StayHaven UK</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: #f8f9fb;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .auth-card h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .auth-card .intro {
      color: #667085;
      margin-bottom: 25px;
    }

    .auth-card label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .auth-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }

    .auth-card button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .auth-card button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .forgot-password {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #b88945;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      color: #667085;
    }

    .auth-footer a {
      color: #b88945;
      font-weight: 700;
      text-decoration: none;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <p class="eyebrow">OWNER ACCESS</p>

      <h1>Welcome back</h1>

      <p class="intro">
        Log in to manage your holiday properties and booking requests.
      </p>


      <form id="loginForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >


        <a
          href="forgot-password.html"
          class="forgot-password"
        >
          Forgot password?
        </a>


        <button
          type="submit"
          id="loginButton"
        >
          Log In
        </button>

      </form>


      <p id="message"></p>


      <div class="auth-footer">

        Don't have an account?

        <a href="register.html">
          Create an owner account
        </a>

      </div>


      <div class="back-home">

        <a href="index.html">
          ← Back to home
        </a>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        message.textContent =
          "Logging in...";

        message.style.color =
          "#667085";


        loginButton.disabled =
          true;


        try {

          const {
            data,
            error
          } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


          if (error) {

            throw error;

          }


          if (!data.user) {

            throw new Error(
              "Unable to log in. Please try again."
            );

          }


          message.textContent =
            "Login successful! Redirecting...";

          message.style.color =
            "green";


          setTimeout(function() {

            window.location.href =
              "dashboard.html";

          }, 700);


        } catch (error) {

          console.error(error);


          message.textContent =
            error.message ||
            "Unable to log in.";

          message.style.color =
            "red";


          loginButton.disabled =
            false;

        }

      }
    );

  </script>

</body>
  </html>
