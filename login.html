<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Login | StayHaven</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    .auth-page {
      max-width: 500px;
      margin: 70px auto;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      padding: 35px;
    }

    .auth-card h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #b88945;
      color: white;
      padding: 15px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #b88945;
      font-weight: 700;
    }

    .forgot-link {
      display: block;
      margin-top: 10px;
      text-align: right;
      font-size: 13px;
      color: #667085;
    }

    @media (max-width: 600px) {
      .auth-page {
        margin: 35px auto;
      }

      .auth-card {
        padding: 25px;
      }
    }
  </style></head><body><header class="navbar">  <div class="logo">
    StayHaven
  </div>  <nav>
    <a href="index.html">Home</a>
    <a href="properties.html">Properties</a>
    <a href="register.html">Create Account</a>
  </nav></header><main class="auth-page">  <div class="auth-card"><p class="eyebrow">
  OWNER ACCOUNT
</p>

<h1>
  Welcome back
</h1>

<p class="intro">
  Log in to manage your properties and booking requests.
</p>


<form id="loginForm">

  <div class="form-group">

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >

  </div>


  <div class="form-group">

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <a
      href="forgot-password.html"
      class="forgot-link"
    >
      Forgot password?
    </a>

  </div>


  <button
    type="submit"
    id="loginButton"
    class="submit-button"
  >
    Log In
  </button>

</form>


<div
  id="message"
  class="message"
></div>


<div class="auth-links">

  Don't have an account?

  <a href="register.html">
    Create one
  </a>

</div>

  </div></main><script src="supabase.js"></script><script>

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    message.className =
      "message";


    try {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "Supabase connection is not available."
        );

      }


      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email) {

        throw new Error(
          "Please enter your email address."
        );

      }


      if (!password) {

        throw new Error(
          "Please enter your password."
        );

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        throw error;

      }


      if (!data || !data.user) {

        throw new Error(
          "Login was not completed."
        );

      }


      showMessage(
        "Login successful. Opening your dashboard...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        700
      );

    }


    catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      showMessage(
        error.message ||
        "Unable to log in.",
        "error"
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Log In";

    }

  });

</script></body>
  </html>
