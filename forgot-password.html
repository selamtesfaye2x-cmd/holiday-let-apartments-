<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Forgot Password | StayHaven</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    .auth-page {
      max-width: 500px;
      margin: 70px auto;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      padding: 35px;
    }

    .auth-card h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #b88945;
      color: white;
      padding: 15px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #b88945;
      font-weight: 700;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .auth-page {
        margin: 35px auto;
      }

      .auth-card {
        padding: 25px;
      }
    }
  </style></head><body><header class="navbar">  <div class="logo">
    StayHaven
  </div>  <nav>
    <a href="index.html">Home</a>
    <a href="properties.html">Properties</a>
    <a href="login.html">Login</a>
  </nav></header><main class="auth-page">  <div class="auth-card"><a
  href="login.html"
  class="back-link"
>
  ← Back to Login
</a>

<p class="eyebrow">
  ACCOUNT RECOVERY
</p>

<h1>
  Forgot your password?
</h1>

<p class="intro">
  Enter your email address and we'll send you a password reset link.
</p>


<form id="forgotPasswordForm">

  <div class="form-group">

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >

  </div>


  <button
    type="submit"
    id="resetButton"
    class="submit-button"
  >
    Send Reset Link
  </button>

</form>


<div
  id="message"
  class="message"
></div>


<div class="auth-links">

  Remember your password?

  <a href="login.html">
    Log in
  </a>

</div>

  </div></main><script src="supabase.js"></script><script>

const forgotPasswordForm =
  document.getElementById(
    "forgotPasswordForm"
  );

const resetButton =
  document.getElementById(
    "resetButton"
  );

const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " + type;

}


forgotPasswordForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    resetButton.disabled =
      true;

    resetButton.textContent =
      "Sending...";

    message.className =
      "message";


    try {

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "Supabase connection is not available."
        );

      }


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      if (!email) {

        throw new Error(
          "Please enter your email address."
        );

      }


      const {
        error
      } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                "/stayhaven.com/reset-password.html"
            }
          );


      if (error) {

        throw error;

      }


      showMessage(
        "Password reset link sent. Please check your email.",
        "success"
      );


      forgotPasswordForm.reset();

    }


    catch (error) {

      console.error(
        "PASSWORD RESET ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Unable to send password reset link.",
        "error"
      );

    }


    finally {

      resetButton.disabled =
        false;

      resetButton.textContent =
        "Send Reset Link";

    }

  });

</script></body>
  </html>
