<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | StayHaven UK</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: #f8f9fb;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .auth-card h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .intro {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      min-height: 20px;
      font-size: 14px;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #b88945;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

<main class="auth-page">

  <section class="auth-card">

    <p class="eyebrow">PASSWORD RESET</p>

    <h1>Forgot your password?</h1>

    <p class="intro">
      Enter the email address associated with your account.
      We'll send you a link to reset your password.
    </p>


    <form id="forgotPasswordForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >


      <button
        type="submit"
        id="resetButton"
      >
        Send Reset Link
      </button>

    </form>


    <p id="message"></p>


    <div class="back">

      <a href="login.html">
        ← Back to login
      </a>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("forgotPasswordForm");

const message =
  document.getElementById("message");

const resetButton =
  document.getElementById("resetButton");


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    message.textContent =
      "Sending reset link...";

    message.style.color =
      "#667085";


    resetButton.disabled =
      true;


    try {

      const {
        error
      } = await supabaseClient.auth.resetPasswordForEmail(

        email,

        {
          redirectTo:
            window.location.origin +
            window.location.pathname
              .replace(
                "forgot-password.html",
                "reset-password.html"
              )
        }

      );


      if (error) {

        throw error;

      }


      message.textContent =
        "Password reset link sent! Please check your email.";

      message.style.color =
        "green";


    } catch (error) {

      console.error(error);


      message.textContent =
        error.message ||
        "Unable to send reset link.";

      message.style.color =
        "red";


      resetButton.disabled =
        false;

    }

  }
);

</script>

</body>
  </html>
