/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://hbuoucmdgtwryahlnjzf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OqqklL691qHVkDvkZisQ5w_IhepZwCb";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   PROPERTY ID
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const propertyId =
  params.get("id");

const pageContent =
  document.getElementById(
    "pageContent"
  );


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==================================================
   FORMAT CURRENCY
================================================== */

function formatCurrency(amount, currency) {

  const safeCurrency =
    currency || "GBP";

  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 2
      }
    ).format(
      Number(amount) || 0
    );

  }

  catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0).toFixed(2)
    );

  }

}


/* ==================================================
   DETERMINE RENTAL TYPE
================================================== */

function getRentalType(property) {

  const rawType =
    String(
      property.property_type ||
      property.rental_type ||
      property.type ||
      property.category ||
      "holiday"
    )
    .toLowerCase()
    .trim();


  /* VEHICLE */

  if (
    rawType.includes("vehicle") ||
    rawType.includes("car") ||
    rawType.includes("auto")
  ) {

    return {

      name: "Vehicle Rental",

      unit: "day",

      bookingTitle: "Request to Rent",

      personLabel: "Passengers",

      startLabel: "Rental Start",

      endLabel: "Rental End"

    };

  }


  /* LONG TERM */

  if (
    rawType.includes("long") ||
    rawType.includes("monthly") ||
    rawType.includes("apartment rental") ||
    rawType.includes("residential")
  ) {

    return {

      name: "Long-Term Rental",

      unit: "month",

      bookingTitle: "Request to Rent",

      personLabel: "Occupants",

      startLabel: "Move-in",

      endLabel: "Move-out"

    };

  }


  /* HOLIDAY */

  return {

    name: "Holiday Let",

    unit: "night",

    bookingTitle: "Request to Book",

    personLabel: "Guests",

    startLabel: "Check-in",

    endLabel: "Check-out"

  };

}


/* ==================================================
   GET CORRECT PRICE
================================================== */

function getPriceAmount(property) {

  const rentalType =
    getRentalType(property);


  /* LONG TERM */

  if (
    rentalType.unit === "month"
  ) {

    if (
      property.price_per_month !== undefined &&
      property.price_per_month !== null &&
      property.price_per_month !== ""
    ) {

      return property.price_per_month;

    }

  }


  /* VEHICLE */

  if (
    rentalType.unit === "day"
  ) {

    if (
      property.price_per_day !== undefined &&
      property.price_per_day !== null &&
      property.price_per_day !== ""
    ) {

      return property.price_per_day;

    }

  }


  /* HOLIDAY */

  if (
    property.price_per_night !== undefined &&
    property.price_per_night !== null &&
    property.price_per_night !== ""
  ) {

    return property.price_per_night;

  }


  return 0;

}


/* ==================================================
   LOAD PROPERTY
================================================== */

async function loadProperty() {

  try {

    if (!propertyId) {

      throw new Error(
        "Property ID is missing from the URL."
      );

    }


    /* PROPERTY */

    const {
      data: property,
      error: propertyError
    } =
      await supabaseClient
        .from("properties")
        .select("*")
        .eq("id", propertyId)
        .single();


    if (propertyError) {

      throw new Error(
        "Property database error: " +
        propertyError.message
      );

    }


    if (!property) {

      throw new Error(
        "Property not found."
      );

    }


    /* RENTAL TYPE */

    const rentalType =
      getRentalType(property);


    /* CURRENCY */

    const currency =
      property.currency || "GBP";


    /* PRICE */

    const priceAmount =
      getPriceAmount(property);


    const formattedPrice =
      formatCurrency(
        priceAmount,
        currency
      );


    /* PHOTOS */

    const {
      data: images,
      error: imageError
    } =
      await supabaseClient
        .from("property_images")
        .select("*")
        .eq(
          "property_id",
          propertyId
        )
        .order(
          "is_cover",
          {
            ascending: false
          }
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (imageError) {

      throw new Error(
        "Photo database error: " +
        imageError.message
      );

    }


    const photos =
      images || [];


    /* GALLERY */

    let galleryHtml = "";


    if (photos.length === 0) {

      galleryHtml = `

        <div class="gallery">

          <div class="gallery-item">

            <div class="no-photo">

              No property photos available

            </div>

          </div>

        </div>

      `;

    }

    else {

      const visiblePhotos =
        photos.slice(0, 5);


      galleryHtml = `

        <div class="gallery">

          ${
            visiblePhotos
              .map(
                (photo, index) => `

                  <div class="gallery-item">

                    <img
                      src="${escapeHtml(
                        photo.image_url
                      )}"
                      alt="${escapeHtml(
                        property.name
                      )}"
                    >

                    ${
                      index === 0 &&
                      photos.length > 1

                        ? `

                          <span class="gallery-count">

                            ${photos.length} photos

                          </span>

                        `

                        : ""
                    }

                  </div>

                `
              )
              .join("")
          }

        </div>

      `;

    }


    /* DISPLAY */

    pageContent.innerHTML = `

      <a
        href="properties.html"
        class="back-link"
      >

        ← Back to Holiday Lets

      </a>


      ${galleryHtml}


      <div class="property-layout">


        <section class="property-info">


          <span class="rental-type">

            ${escapeHtml(
              rentalType.name
            )}

          </span>


          <h1>

            ${escapeHtml(
              property.name
            )}

          </h1>


          <p class="location">

            📍

            ${escapeHtml(
              property.location ||
              "Location not provided"
            )}

          </p>


          <div class="features">


            <div class="feature">

              <strong>

                ${escapeHtml(
                  property.bedrooms ?? "—"
                )}

              </strong>

              <span>
                Bedrooms
              </span>

            </div>


            <div class="feature">

              <strong>

                ${escapeHtml(
                  property.bathrooms ?? "—"
                )}

              </strong>

              <span>
                Bathrooms
              </span>

            </div>


            <div class="feature">

              <strong>

                ${escapeHtml(
                  property.max_guests ?? "—"
                )}

              </strong>

              <span>

                ${
                  rentalType.name === "Vehicle Rental"
                    ? "Passengers"
                    : rentalType.name === "Long-Term Rental"
                      ? "Occupants"
                      : "Guests"
                }

              </span>

            </div>


          </div>


          <h2>
            About this property
          </h2>


          <p class="property-description">

            ${escapeHtml(
              property.description ||
              "No description provided."
            )}

          </p>


        </section>


        <aside class="booking-card">


          <div class="price">

            ${escapeHtml(
              formattedPrice
            )}

            <small>

              / ${escapeHtml(
                rentalType.unit
              )}

            </small>

          </div>


          <h2>

            ${escapeHtml(
              rentalType.bookingTitle
            )}

          </h2>


          <form id="bookingForm">


            <div class="form-group">

              <label for="guestName">
                Full Name
              </label>

              <input
                type="text"
                id="guestName"
                autocomplete="name"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestEmail">
                Email Address
              </label>

              <input
                type="email"
                id="guestEmail"
                autocomplete="email"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestPhone">
                Phone Number
              </label>

              <input
                type="tel"
                id="guestPhone"
                autocomplete="tel"
                placeholder="+1 555 123 4567"
              >

            </div>


            <div class="date-row">


              <div class="form-group">

                <label for="checkIn">

                  ${escapeHtml(
                    rentalType.startLabel
                  )}

                </label>

                <input
                  type="date"
                  id="checkIn"
                  required
                >

              </div>


              <div class="form-group">

                <label for="checkOut">

                  ${escapeHtml(
                    rentalType.endLabel
                  )}

                </label>

                <input
                  type="date"
                  id="checkOut"
                  required
                >

              </div>


            </div>


            <div class="form-group">

              <label for="guests">

                ${escapeHtml(
                  rentalType.personLabel
                )}

              </label>

              <input
                type="number"
                id="guests"
                min="1"
                ${
                  property.max_guests
                    ? `max="${Number(
                        property.max_guests
                      )}"`
                    : ""
                }
                value="1"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestMessage">
                Message
              </label>

              <textarea
                id="guestMessage"
                placeholder="Message to the owner..."
              ></textarea>        </div>


        <button
          type="submit"
          id="bookingButton"
          class="booking-button"
        >

          ${escapeHtml(
            rentalType.bookingTitle
          )}

        </button>


      </form>


      <div
        id="bookingMessage"
        class="message"
      ></div>


    </aside>


  </div>

`;


document
  .getElementById("bookingForm")
  .addEventListener(
    "submit",
    submitBooking
  );

}

catch (error) {

console.error(
  "PROPERTY PAGE ERROR:",
  error
);


pageContent.innerHTML = `

  <div class="error-box">

    <h2>
      Unable to load property
    </h2>

    <p>

      ${escapeHtml(
        error.message
      )}

    </p>

    <br>

    <a href="properties.html">

      ← Back to Holiday Lets

    </a>

  </div>

`;

}

}

/* ==================================================
SUBMIT BOOKING
================================================== */

async function submitBooking(event) {

event.preventDefault();

const button =
document.getElementById(
"bookingButton"
);

const message =
document.getElementById(
"bookingMessage"
);

button.disabled = true;

button.textContent =
"Sending request...";

message.className =
"message";

try {

const guestName =
  document
    .getElementById("guestName")
    .value
    .trim();


const guestEmail =
  document
    .getElementById("guestEmail")
    .value
    .trim();


const guestPhone =
  document
    .getElementById("guestPhone")
    .value
    .trim();


const checkIn =
  document
    .getElementById("checkIn")
    .value;


const checkOut =
  document
    .getElementById("checkOut")
    .value;


const guests =
  Number(
    document
      .getElementById("guests")
      .value
  );


const guestMessage =
  document
    .getElementById("guestMessage")
    .value
    .trim();


/* DATE VALIDATION */

if (
  new Date(checkOut) <=
  new Date(checkIn)
) {

  throw new Error(
    "The end date must be after the start date."
  );

}


/* GUEST VALIDATION */

const guestInput =
  document.getElementById("guests");


const maxGuests =
  guestInput.max
    ? Number(guestInput.max)
    : null;


if (
  guests < 1
) {

  throw new Error(
    "Please enter at least one guest."
  );

}


if (
  maxGuests &&
  guests > maxGuests
) {

  throw new Error(
    "The number entered exceeds the property's maximum."
  );

}


/* ==============================================
   BLOCKED DATES
=========================================const {
  data: blockedDates,
  error: blockedError
} = await supabaseClient
  .from("blocked_dates")
  .select("start_date, end_date")
  .eq("property_id", propertyId);

if (blockedError) {

  throw new Error(
    "Availability error: " +
    blockedError.message
  );

}


/* CHECK BLOCKED DATE OVERLAP */

const requestedStart =
  new Date(checkIn);

const requestedEnd =
  new Date(checkOut);


const blockedOverlap =
  (blockedDates || []).some(
    blocked => {

      const blockedStart =
        new Date(
          blocked.start_date
        );

      const blockedEnd =
        new Date(
          blocked.end_date
        );

      return (
        requestedStart < blockedEnd &&
        requestedEnd > blockedStart
      );

    }
  );


if (blockedOverlap) {

  throw new Error(
    "Some of the selected dates are unavailable."
  );

}


/* ==============================================
   CHECK EXISTING BOOKINGS
============================================== */

const {
  data: existingBookings,
  error: bookingCheckError
} = await supabaseClient
  .from("bookings")
  .select(
    "check_in, check_out, status"
  )
  .eq(
    "property_id",
    propertyId
  )
  .in(
    "status",
    [
      "pending",
      "confirmed"
    ]
  );


if (bookingCheckError) {

  throw new Error(
    "Booking availability error: " +
    bookingCheckError.message
  );

}


/* CHECK BOOKING OVERLAP */

const bookingOverlap =
  (existingBookings || []).some(
    booking => {

      const existingStart =
        new Date(
          booking.check_in
        );

      const existingEnd =
        new Date(
          booking.check_out
        );

      return (
        requestedStart < existingEnd &&
        requestedEnd > existingStart
      );

    }
  );


if (bookingOverlap) {

  throw new Error(
    "Those dates already have a booking request or confirmed booking."
  );

}


/* ==============================================
   DETERMINE RENTAL TYPE
============================================== */

const {
  data: currentProperty,
  error: currentPropertyError
} = await supabaseClient
  .from("properties")
  .select("*")
  .eq("id", propertyId)
  .single();


if (currentPropertyError) {

  throw new Error(
    "Unable to verify property: " +
    currentPropertyError.message
  );

}


const rentalType =
  getRentalType(
    currentProperty
  );


const priceAmount =
  getPriceAmount(
    currentProperty
  );


const currency =
  currentProperty.currency ||
  "GBP";


/* ==============================================
   CALCULATE RENTAL PERIOD
============================================== */

const startDate =
  new Date(checkIn);

const endDate =
  new Date(checkOut);


const differenceMs =
  endDate.getTime() -
  startDate.getTime();


const differenceDays =
  Math.ceil(
    differenceMs /
    (1000 * 60 * 60 * 24)
  );


let rentalUnits =
  differenceDays;


/*
  Holiday lets and vehicle rentals use days/nights.

  Long-term rentals use months.
*/

if (
  rentalType.unit === "month"
) {

  const start =
    new Date(checkIn);

  const end =
    new Date(checkOut);

  rentalUnits =
    (
      (end.getFullYear() -
        start.getFullYear()) * 12
    ) +
    (
      end.getMonth() -
      start.getMonth()
    );

  /*
    If dates are not a complete month,
    count it as one month.
  */

  if (
    rentalUnits < 1
  ) {

    rentalUnits = 1;

  }

}


/* ==============================================
   CALCULATE TOTAL PRICE
============================================== */

const totalPrice =
  Number(priceAmount || 0) *
  Number(rentalUnits || 1);


/* ==============================================
   CREATE BOOKING
============================================== */

const {
  data: newBooking,
  error: insertError
} = await supabaseClient
  .from("bookings")
  .insert({

    property_id:
      propertyId,

    guest_name:
      guestName,

    guest_email:
      guestEmail,

    guest_phone:
      guestPhone,

    check_in:
      checkIn,

    check_out:
      checkOut,

    guests:
      guests,

    message:
      guestMessage,

    status:
      "pending"

  })
  .select()
  .single();


if (insertError) {

  throw new Error(
    "Booking submission failed: " +
    insertError.message
  );

}


/* ==============================================
   SUCCESS MESSAGE
============================================== */

const formattedTotal =
  formatCurrency(
    totalPrice,
    currency
  );


message.textContent =
  "Booking request sent successfully! " +
  "Estimated total: " +
  formattedTotal +
  ". The property owner will review your request.";


message.className =
  "message success";


button.textContent =
  "Request Sent";


/* RESET FORM */

document
  .getElementById(
    "bookingForm"
  )
  .reset();


/* KEEP BUTTON DISABLED AFTER SUCCESS */

button.disabled = true;

}

catch (error) {

console.error(
  "BOOKING ERROR:",
  error
);


message.textContent =
  error.message ||
  "Something went wrong. Please try again.";


message.className =
  "message error";
