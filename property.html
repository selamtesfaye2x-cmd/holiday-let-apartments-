  </p></footer><script src="supabase.js"></script><script>


let currentProperty = null;


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   CURRENCY
========================================= */

function formatCurrency(
  amount,
  currency
) {

  const safeCurrency =
    currency || "GBP";


  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 2
      }
    ).format(
      Number(amount) || 0
    );

  }

  catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0).toFixed(2)
    );

  }

}


/* =========================================
   RENTAL INFO
========================================= */

function getRentalInfo(property) {

  const type =
    String(
      property.property_type ||
      "holiday_let"
    )
    .toLowerCase()
    .trim();


  if (
    type === "long_term_rental"
  ) {

    return {
      name: "Long-Term Rental",
      unit: "month",
      price:
        property.price_per_month ||
        property.price_per_night ||
        0
    };

  }


  if (
    type === "short_term_rental"
  ) {

    return {
      name: "Short-Term Rental",
      unit: "night",
      price:
        property.price_per_night ||
        property.price_per_day ||
        0
    };

  }


  return {
    name: "Holiday Let",
    unit: "night",
    price:
      property.price_per_night ||
      0
  };

}


/* =========================================
   LOAD PROPERTY
========================================= */

async function loadProperty() {

  const page =
    document.getElementById(
      "propertyPage"
    );


  try {

    if (
      typeof supabaseClient ===
      "undefined"
    ) {

      throw new Error(
        "Supabase connection is unavailable."
      );

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const propertyId =
      params.get("id");


    if (!propertyId) {

      throw new Error(
        "No property was selected."
      );

    }


    const {
      data: property,
      error
    } =
      await supabaseClient
        .from("properties")
        .select("*")
        .eq(
          "id",
          propertyId
        )
        .single();


    if (error) {

      throw error;

    }


    if (!property) {

      throw new Error(
        "Property not found."
      );

    }


    currentProperty =
      property;


    const rental =
      getRentalInfo(
        property
      );


    const formattedPrice =
      formatCurrency(
        rental.price,
        property.currency
      );


    page.innerHTML = `

      <a
        href="properties.html"
        class="back-link"
      >
        ← Back to Properties
      </a>


      <div class="property-hero"></div>


      <div class="property-layout">


        <section class="property-info">


          <span class="property-type">

            ${escapeHtml(
              rental.name
            )}

          </span>


          <h1>

            ${escapeHtml(
              property.name
            )}

          </h1>


          <p class="location">

            📍 ${escapeHtml(
              property.location
            )}

          </p>


          <p class="price">

            ${escapeHtml(
              formattedPrice
            )}

            per ${escapeHtml(
              rental.unit
            )}

          </p>


          <div class="details-box">


            <div class="detail">

              🛏️

              ${escapeHtml(
                property.bedrooms
              )}

              Bedrooms

            </div>


            <div class="detail">

              🚿

              ${escapeHtml(
                property.bathrooms
              )}

              Bathrooms

            </div>


            <div class="detail">

              👥 Up to

              ${escapeHtml(
                property.max_guests
              )}

              Guests

            </div>


          </div>


          <h2>
            About this property
          </h2>


          <p class="description">

            ${escapeHtml(
              property.description ||
              "No description provided."
            )}

          </p>


        </section>



        <aside class="booking-card">


          <h2>
            Request a Booking
          </h2>


          <p>
            Send your request directly to the property owner.
          </p>


          <form id="bookingForm">


            <div class="form-group">

              <label for="guestName">
                Full Name
              </label>

              <input
                type="text"
                id="guestName"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestEmail">
                Email Address
              </label>

              <input
                type="email"
                id="guestEmail"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestPhone">
                Phone Number
              </label>

              <input
                type="tel"
                id="guestPhone"
              >

            </div>


            <div class="form-group">

              <label for="checkIn">
                Check-in
              </label>

              <input
                type="date"
                id="checkIn"
                required
              >

            </div>


            <div class="form-group">

              <label for="checkOut">
                Check-out
              </label>

              <input
                type="date"
                id="checkOut"
                required
              >

            </div>


            <div class="form-group">

              <label for="guests">
                Number of Guests
              </label>

              <input
                type="number"
                id="guests"
                min="1"
                value="1"
                required
              >

            </div>


            <div class="form-group">

              <label for="bookingMessage">
                Message
              </label>

              <textarea
                id="bookingMessage"
                placeholder="Tell the owner about your stay..."
              ></textarea>        </div>


        <button
          type="submit"
          id="bookingButton"
          class="submit-button"
        >
          Send Booking Request
        </button>


      </form>


      <div
        id="bookingMessageBox"
        class="message"
      ></div>


    </aside>


  </div>

`;


setupBookingForm();

}

catch (error) {

console.error(
  "PROPERTY ERROR:",
  error
);


page.innerHTML = `

  <div class="error-state">

    <h2>
      Unable to load property
    </h2>

    <p>

      ${escapeHtml(
        error.message
      )}

    </p>

    <br>

    <a
      href="properties.html"
      class="primary-button"
    >
      Back to Properties
    </a>

  </div>

`;

}

}

/* =========================================
BOOKING FORM
========================================= */

function setupBookingForm() {

const bookingForm =
document.getElementById(
"bookingForm"
);

if (!bookingForm) {

return;

}

const bookingButton =
document.getElementById(
"bookingButton"
);

const messageBox =
document.getElementById(
"bookingMessageBox"
);

const checkIn =
document.getElementById(
"checkIn"
);

const checkOut =
document.getElementById(
"checkOut"
);

const today =
new Date()
.toISOString()
.split("T")[0];

checkIn.min =
today;

checkOut.min =
today;

bookingForm.addEventListener(
"submit",
async function(event) {

  event.preventDefault();


  bookingButton.disabled =
    true;

  bookingButton.textContent =
    "Sending...";


  messageBox.className =
    "message";


  try {


    const guestName =
      document
        .getElementById(
          "guestName"
        )
        .value
        .trim();


    const guestEmail =
      document
        .getElementById(
          "guestEmail"
        )
        .value
        .trim();


    const guestPhone =
      document
        .getElementById(
          "guestPhone"
        )
        .value
        .trim();


    const checkInDate =
      checkIn.value;


    const checkOutDate =
      checkOut.value;


    const guests =
      Number(
        document
          .getElementById(
            "guests"
          )
          .value
      );


    const guestMessage =
      document
        .getElementById(
          "bookingMessage"
        )
        .value
        .trim();


    if (
      !guestName ||
      !guestEmail ||
      !checkInDate ||
      !checkOutDate
    ) {

      throw new Error(
        "Please complete all required fields."
      );

    }


    if (
      new Date(checkOutDate) <=
      new Date(checkInDate)
    ) {

      throw new Error(
        "Check-out must be after check-in."
      );

    }


    if (
      !Number.isFinite(guests) ||
      guests < 1
    ) {

      throw new Error(
        "Please enter a valid number of guests."
      );

    }


    if (
      currentProperty.max_guests &&
      guests >
      Number(
        currentProperty.max_guests
      )
    ) {

      throw new Error(
        "The number of guests exceeds the property's maximum capacity."
      );

    }


    const {
      error
    } =
      await supabaseClient
        .from("bookings")
        .insert({
          property_id:
            currentProperty.id,

          guest_name:
            guestName,

          guest_email:
            guestEmail,

          guest_phone:
            guestPhone || null,

          check_in:
            checkInDate,

          check_out:
            checkOutDate,

          guests:
            guests,

          message:
            guestMessage || null,

          status:
            "pending"
        });


    if (error) {

      throw error;

    }


    messageBox.textContent =
      "Booking request sent successfully! The owner will review your request.";


    messageBox.className =
      "message success";


    bookingForm.reset();


  }


  catch (error) {

    console.error(
      "BOOKING ERROR:",
      error
    );


    messageBox.textContent =
      error.message ||
      "Unable to send booking request.";


    messageBox.className =
      "message error";

  }


  finally {

    bookingButton.disabled =
      false;

    bookingButton.textContent =
      "Send Booking Request";

  }

}

);

}

/* =========================================
START
========================================= */

loadProperty();

</script></body>
