<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Property | StayHaven</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      background: #f8f8f8;
    }

    .property-page {
      max-width: 1150px;
      margin: 35px auto;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 220px 220px;
      gap: 8px;
      margin-bottom: 35px;
      border-radius: 15px;
      overflow: hidden;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: #eee;
    }

    .gallery-item:first-child {
      grid-row: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .no-photo {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #667085;
    }

    .gallery-count {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,.7);
      color: white;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .property-layout {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 35px;
      align-items: start;
    }

    .property-info,
    .booking-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 28px;
    }

    .property-info h1 {
      margin: 5px 0 8px;
      font-size: 34px;
    }

    .location {
      color: #667085;
      margin-bottom: 25px;
    }

    .property-description {
      color: #444;
      line-height: 1.7;
      white-space: pre-line;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 25px 0;
    }

    .feature {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .feature strong {
      display: block;
      font-size: 20px;
    }

    .feature span {
      color: #667085;
      font-size: 12px;
    }

    .price {
      font-size: 27px;
      font-weight: 800;
      color: #172033;
      margin-bottom: 20px;
    }

    .price small {
      font-size: 14px;
      font-weight: 400;
      color: #667085;
    }

    .booking-card {
      position: sticky;
      top: 20px;
    }

    .booking-card h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .booking-button {
      width: 100%;
      border: 0;
      background: #b88945;
      color: white;
      padding: 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }

    .booking-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .loading {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
      padding: 30px;
    }

    .error-box {
      max-width: 700px;
      margin: 80px auto;
      background: #fdecec;
      color: #b42318;
      padding: 25px;
      border-radius: 10px;
    }

    @media (max-width: 800px) {

      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 220px 140px;
      }

      .gallery-item:first-child {
        grid-column: span 2;
        grid-row: span 1;
      }

      .property-layout {
        grid-template-columns: 1fr;
      }

      .booking-card {
        position: static;
      }

      .property-info h1 {
        font-size: 27px;
      }

    }

    @media (max-width: 500px) {

      .gallery {
        grid-template-columns: 1fr;
        grid-template-rows: 250px;
      }

      .gallery-item {
        display: none;
      }

      .gallery-item:first-child {
        display: block;
        grid-column: span 1;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .date-row {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>

    <a href="index.html">Home</a>

    <a href="properties.html">Holiday Lets</a>

  </nav>

</header>


<main
  id="pageContent"
  class="property-page"
>

  <div class="loading">
    Loading property...
  </div>

</main>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://hbuoucmdgtwryahlnjzf.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_OqqklL691qHVkDvkZisQ5w_IhepZwCb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   PROPERTY ID
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const propertyId =
  params.get("id");


const pageContent =
  document.getElementById(
    "pageContent"
  );


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==================================================
   FORMAT CURRENCY
================================================== */

function formatCurrency(
  amount,
  currency
) {

  const safeCurrency =
    currency || "GBP";


  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 2
      }
    ).format(
      Number(amount) || 0
    );

  }

  catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0).toFixed(2)
    );

  }

}


/* ==================================================
   LOAD PROPERTY
================================================== */

async function loadProperty() {

  try {

    if (!propertyId) {

      throw new Error(
        "Property ID is missing from the URL."
      );

    }


    /* PROPERTY */

    const {
      data: property,
      error: propertyError
    } =
      await supabaseClient

        .from("properties")

        .select("*")

        .eq("id", propertyId)

        .single();


    if (propertyError) {

      throw new Error(
        "Property database error: " +
        propertyError.message
      );

    }


    if (!property) {

      throw new Error(
        "Property not found."
      );

    }


    /* CURRENCY */

    const currency =
      property.currency ||
      "GBP";


    const formattedPrice =
      formatCurrency(
        property.price_per_night,
        currency
      );


    /* PHOTOS */

    const {
      data: images,
      error: imageError
    } =
      await supabaseClient

        .from("property_images")

        .select("*")

        .eq(
          "property_id",
          propertyId
        )

        .order(
          "is_cover",
          {
            ascending: false
          }
        )

        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (imageError) {

      throw new Error(
        "Photo database error: " +
        imageError.message
      );

    }


    const photos =
      images || [];


    /* GALLERY */

    let galleryHtml = "";


    if (photos.length === 0) {

      galleryHtml = `

        <div class="gallery">

          <div class="gallery-item">

            <div class="no-photo">
              No property photos available
            </div>

          </div>

        </div>

      `;

    }

    else {

      const visiblePhotos =
        photos.slice(0, 5);


      galleryHtml = `

        <div class="gallery">

          ${
            visiblePhotos
              .map(
                (photo, index) => `

                  <div class="gallery-item">

                    <img
                      src="${escapeHtml(
                        photo.image_url
                      )}"
                      alt="${escapeHtml(
                        property.name
                      )}"
                    >

                    ${
                      index === 0 &&
                      photos.length > 1

                        ? `

                          <span class="gallery-count">

                            ${photos.length} photos

                          </span>

                        `

                        : ""
                    }

                  </div>

                `
              )
              .join("")
          }

        </div>

      `;

    }


    /* DISPLAY */

    pageContent.innerHTML = `

      <a
        href="properties.html"
        class="back-link"
      >
        ← Back to Holiday Lets
      </a>


      ${galleryHtml}


      <div class="property-layout">


        <section class="property-info">


          <p class="eyebrow">
            HOLIDAY LET
          </p>


          <h1>
            ${escapeHtml(property.name)}
          </h1>


          <p class="location">
            📍
            ${escapeHtml(
              property.location ||
              "Location not provided"
            )}
          </p>


          <div class="features">


            <div class="feature">

              <strong>
                ${escapeHtml(
                  property.bedrooms
                )}
              </strong>

              <span>
                Bedrooms
              </span>

            </div>


            <div class="feature">

              <strong>
                ${escapeHtml(
                  property.bathrooms
                )}
              </strong>

              <span>
                Bathrooms
              </span>

            </div>


            <div class="feature">

              <strong>
                ${escapeHtml(
                  property.max_guests
                )}
              </strong>

              <span>
                Guests
              </span>

            </div>


          </div>


          <h2>
            About this property
          </h2>


          <p class="property-description">

            ${escapeHtml(
              property.description ||
              "No description provided."
            )}

          </p>


        </section>


        <aside class="booking-card">


          <div class="price">

            ${escapeHtml(
              formattedPrice
            )}

            <small>
              / night
            </small>

          </div>


          <h2>
            Request to Book
          </h2>


          <form id="bookingForm">


            <div class="form-group">

              <label for="guestName">
                Full Name
              </label>

              <input
                type="text"
                id="guestName"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestEmail">
                Email Address
              </label>

              <input
                type="email"
                id="guestEmail"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestPhone">
                Phone Number
              </label>

              <input
                type="tel"
                id="guestPhone"
                placeholder="+1 555 123 4567"
              >

            </div>


            <div class="date-row">


              <div class="form-group">

                <label for="checkIn">
                  Check-in
                </label>

                <input
                  type="date"
                  id="checkIn"
                  required
                >

              </div>


              <div class="form-group">

                <label for="checkOut">
                  Check-out
                </label>

                <input
                  type="date"
                  id="checkOut"
                  required
                >

              </div>


            </div>


            <div class="form-group">

              <label for="guests">
                Number of Guests
              </label>

              <input
                type="number"
                id="guests"
                min="1"
                max="${Number(
                  property.max_guests
                )}"
                value="1"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestMessage">
                Message
              </label>

              <textarea
                id="guestMessage"
                placeholder="Message to the property owner..."
              ></textarea>

            </div>


            <button
              type="submit"
              id="bookingButton"
              class="booking-button"
            >
              Send Booking Request
            </button>


          </form>


          <div
            id="bookingMessage"
            class="message"
          ></div>


        </aside>


      </div>

    `;


    document
      .getElementById("bookingForm")
      .addEventListener(
        "submit",
        submitBooking
      );

  }


  catch (error) {

    console.error(
      "PROPERTY PAGE ERROR:",
      error
    );


    pageContent.innerHTML = `

      <div class="error-box">

        <h2>
          Unable to load property
        </h2>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

        <br>

        <a href="properties.html">
          ← Back to Holiday Lets
        </a>

      </div>

    `;

  }

}


/* ==================================================
   SUBMIT BOOKING
================================================== */

async function submitBooking(event) {

  event.preventDefault();


  const button =
    document.getElementById(
      "bookingButton"
    );


  const message =
    document.getElementById(
      "bookingMessage"
    );


  button.disabled = true;

  button.textContent =
    "Sending request...";


  message.className =
    "message";


  try {

    const guestName =
      document
        .getElementById(
          "guestName"
        )
        .value
        .trim();


    const guestEmail =
      document
        .getElementById(
          "guestEmail"
        )
        .value
        .trim();


    const guestPhone =
      document
        .getElementById(
          "guestPhone"
        )
        .value
        .trim();


    const checkIn =
      document
        .getElementById(
          "checkIn"
        )
        .value;


    const checkOut =
      document
        .getElementById(
          "checkOut"
        )
        .value;


    const guests =
      Number(
        document
          .getElementById(
            "guests"
          )
          .value
      );


    const guestMessage =
      document
        .getElementById(
          "guestMessage"
        )
        .value
        .trim();


    if (
      new Date(checkOut)
      <=
      new Date(checkIn)
    ) {

      throw new Error(
        "Check-out must be after check-in."
      );

    }


    const maxGuests =
      Number(
        document
          .getElementById(
            "guests"
          )
          .max
      );


    if (
      guests < 1 ||
      guests > maxGuests
    ) {

      throw new Error(
        "The number of guests exceeds the property's maximum."
      );

    }


    /* BLOCKED DATES */

    const {
      data: blockedDates,
      error: blockedError
    } =
      await supabaseClient

        .from("blocked_dates")

        .select(
          "start_date, end_date"
        )

        .eq(
          "property_id",
          propertyId
        );


    if (blockedError) {

      throw new Error(
        "Availability error: " +
        blockedError.message
      );

    }


    const requestedStart =
      new Date(checkIn);


    const requestedEnd =
      new Date(checkOut);


    const blockedOverlap =
      (blockedDates || [])
        .some(
          blocked => {

            const blockedStart =
              new Date(
                blocked.start_date
              );


            const blockedEnd =
              new Date(
                blocked.end_date
              );


            return (

              requestedStart <
              blockedEnd

              &&

              requestedEnd >
              blockedStart

            );

          }
        );


    if (blockedOverlap) {

      throw new Error(
        "Some of those dates are unavailable."
      );

    }


    /* EXISTING BOOKINGS */

    const {
      data: existingBookings,
      error: bookingCheckError
    } =
      await supabaseClient

        .from("bookings")

        .select(
          "check_in, check_out, status"
        )

        .eq(
          "property_id",
          propertyId
        )

        .in(
          "status",
          [
            "pending",
            "confirmed"
          ]
        );


    if (bookingCheckError) {

      throw new Error(
        "Booking availability error: " +
        bookingCheckError.message
      );

    }


    const bookingOverlap =
      (existingBookings || [])
        .some(
          booking => {

            const existingStart =
              new Date(
                booking.check_in
              );


            const existingEnd =
              new Date(
                booking.check_out
              );


            return (

              requestedStart <
              existingEnd

              &&

              requestedEnd >
              existingStart

            );

          }
        );


    if (bookingOverlap) {

      throw new Error(
        "Those dates already have a booking request or confirmed booking."
      );

    }


    /* CREATE BOOKING */

    const {
      error: insertError
    } =
      await supabaseClient

        .from("bookings")

        .insert({

          property_id:
            propertyId,

          guest_name:
            guestName,

          guest_email:
            guestEmail,

          guest_phone:
            guestPhone,

          check_in:
            checkIn,

          check_out:
            checkOut,

          guests:
            guests,

          message:
            guestMessage,

          status:
            "pending"

        });


    if (insertError) {

      throw new Error(
        "Booking submission failed: " +
        insertError.message
      );

    }


    message.textContent =
      "Booking request sent successfully! The property owner willreview your request.";

    message.className =
      "message success";

    document
      .getElementById("bookingForm")
      .reset();

  }

  catch (error) {

    console.error(
      "BOOKING ERROR:",
      error
    );

    message.textContent =
      error.message ||
      "Unable to send booking request.";

    message.className =
      "message error";

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "Send Booking Request";

  }

}


/* ==================================================
   START PROPERTY PAGE
================================================== */

loadProperty();

</script>

</body>

</html>
