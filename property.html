<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Property | StayHaven</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    body {
      background: #f8f8f8;
    }

    .property-page {
      max-width: 1150px;
      margin: 35px auto;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 220px 220px;
      gap: 8px;
      margin-bottom: 35px;
      border-radius: 15px;
      overflow: hidden;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: #eeeeee;
    }

    .gallery-item:first-child {
      grid-row: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gallery-item img:hover {
      transform: scale(1.03);
    }

    .no-photo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #667085;
      background: #eeeeee;
    }

    .property-layout {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 35px;
      align-items: start;
    }

    .property-info,
    .booking-card {
      background: white;
      border-radius: 14px;
      border: 1px solid #eeeeee;
      padding: 28px;
    }

    .property-info h1 {
      margin: 5px 0 8px;
      font-size: 34px;
    }

    .location {
      color: #667085;
      margin-bottom: 25px;
    }

    .property-description {
      line-height: 1.7;
      color: #444;
      white-space: pre-line;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 25px 0;
    }

    .feature {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .feature strong {
      display: block;
      font-size: 20px;
    }

    .feature span {
      color: #667085;
      font-size: 12px;
    }

    .price {
      font-size: 27px;
      font-weight: 800;
      color: #172033;
      margin-bottom: 20px;
    }

    .price small {
      font-size: 14px;
      font-weight: 400;
      color: #667085;
    }

    .booking-card {
      position: sticky;
      top: 20px;
    }

    .booking-card h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .booking-button {
      width: 100%;
      border: 0;
      background: #b88945;
      color: white;
      padding: 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }

    .booking-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .loading {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
      padding: 30px;
    }

    .error-box {
      max-width: 700px;
      margin: 80px auto;
      background: #fdecec;
      color: #b42318;
      padding: 25px;
      border-radius: 10px;
    }

    .gallery-count {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    @media (max-width: 800px) {

      .property-page {
        margin: 20px auto;
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 220px 140px;
      }

      .gallery-item:first-child {
        grid-column: span 2;
        grid-row: span 1;
      }

      .property-layout {
        grid-template-columns: 1fr;
      }

      .booking-card {
        position: static;
      }

      .property-info h1 {
        font-size: 27px;
      }

    }

    @media (max-width: 500px) {

      .gallery {
        grid-template-columns: 1fr;
        grid-template-rows: 250px;
      }

      .gallery-item {
        display: none;
      }

      .gallery-item:first-child {
        display: block;
        grid-column: span 1;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .date-row {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="properties.html">
      Holiday Lets
    </a>

  </nav>

</header>



<main
  id="pageContent"
  class="property-page"
>

  <div class="loading">

    Loading property...

  </div>

</main>



<script src="supabase.js"></script>


<script>


/* ========================================
   HELPERS
======================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* ========================================
   GET PROPERTY ID
======================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const propertyId =
  params.get("id");



/* ========================================
   MAIN PAGE
======================================== */

const pageContent =
  document.getElementById(
    "pageContent"
  );



/* ========================================
   CURRENCY
======================================== */

function getCurrencySymbol() {

  return "£";

}



/* ========================================
   LOAD PROPERTY
======================================== */

async function loadProperty() {


  try {


    if (!propertyId) {

      throw new Error(
        "No property was selected."
      );

    }



    /* =====================================
       GET PROPERTY
    ===================================== */

    const {

      data: property,

      error: propertyError

    } =
      await supabaseClient

        .from("properties")

        .select("*")

        .eq(
          "id",
          propertyId
        )

        .single();



    if (propertyError) {

      throw propertyError;

    }



    if (!property) {

      throw new Error(
        "Property not found."
      );

    }



    /* =====================================
       GET PHOTOS
    ===================================== */

    const {

      data: images,

      error: imageError

    } =
      await supabaseClient

        .from("property_images")

        .select("*")

        .eq(
          "property_id",
          propertyId
        )

        .order(
          "is_cover",
          {
            ascending: false
          }
        )

        .order(
          "created_at",
          {
            ascending: true
          }
        );



    if (imageError) {

      throw imageError;

    }



    const photoList =
      images || [];



    /* =====================================
       GALLERY
    ===================================== */

    let galleryHtml = "";



    if (
      photoList.length === 0
    ) {


      galleryHtml = `

        <div class="gallery">

          <div class="gallery-item">

            <div class="no-photo">

              No property photos yet

            </div>

          </div>

        </div>

      `;


    } else {


      const visiblePhotos =
        photoList.slice(
          0,
          5
        );


      galleryHtml = `

        <div class="gallery">

          ${

            visiblePhotos

              .map(
                (photo, index) => `

                  <div class="gallery-item">

                    <img

                      src="${escapeHtml(
                        photo.image_url
                      )}"

                      alt="${escapeHtml(
                        property.name
                      )}"

                    >

                    ${

                      index ===
                      0 &&
                      photoList.length > 1

                        ? `

                          <span
                            class="gallery-count"
                          >

                            ${photoList.length}
                            photos

                          </span>

                        `

                        : ""

                    }

                  </div>

                `
              )

              .join("")

          }

        </div>

      `;

    }



    /* =====================================
       PAGE HTML
    ===================================== */

    pageContent.innerHTML = `

      <a
        href="properties.html"
        class="back-link"
      >

        ← Back to Holiday Lets

      </a>


      ${galleryHtml}


      <div class="property-layout">


        <!-- PROPERTY INFORMATION -->

        <section class="property-info">


          <p class="eyebrow">
            HOLIDAY LET
          </p>


          <h1>

            ${escapeHtml(
              property.name
            )}

          </h1>


          <p class="location">

            📍

            ${escapeHtml(
              property.location ||
              "Location not provided"
            )}

          </p>



          <div class="features">


            <div class="feature">

              <strong>
                ${property.bedrooms}
              </strong>

              <span>
                Bedrooms
              </span>

            </div>


            <div class="feature">

              <strong>
                ${property.bathrooms}
              </strong>

              <span>
                Bathrooms
              </span>

            </div>


            <div class="feature">

              <strong>
                ${property.max_guests}
              </strong>

              <span>
                Guests
              </span>

            </div>


          </div>



          <h2>
            About this property
          </h2>


          <p class="property-description">

            ${escapeHtml(
              property.description ||
              "No description provided."
            )}

          </p>


        </section>



        <!-- BOOKING -->

        <aside class="booking-card">


          <div class="price">

            £${Number(
              property.price_per_night ||
              0
            ).toFixed(2)}

            <small>
              / night
            </small>

          </div>


          <h2>
            Request to Book
          </h2>


          <form id="bookingForm">


            <div class="form-group">

              <label for="guestName">
                Full Name
              </label>

              <input
                type="text"
                id="guestName"
                required
              >

            </div>



            <div class="form-group">

              <label for="guestEmail">
                Email Address
              </label>

              <input
                type="email"
                id="guestEmail"
                required
              >

            </div>



            <div class="form-group">

              <label for="guestPhone">
                Phone Number
              </label>

              <input
                type="tel"
                id="guestPhone"
                placeholder="+1 555 123 4567"
              >

            </div>



            <div class="date-row">


              <div class="form-group">

                <label for="checkIn">
                  Check-in
                </label>

                <input
                  type="date"
                  id="checkIn"
                  required
                >

              </div>


              <div class="form-group">

                <label for="checkOut">
                  Check-out
                </label>

                <input
                  type="date"
                  id="checkOut"
                  required
                >

              </div>


            </div>



            <div class="form-group">

              <label for="guests">
                Number of Guests
              </label>

              <input
                type="number"
                id="guests"
                min="1"
                max="${property.max_guests}"
                value="1"
                required
              >

            </div>



            <div class="form-group">

              <label for="guestMessage">
                Message
              </label>

              <textarea
                id="guestMessage"
                placeholder="Tell the owner anything important about your stay..."
              ></textarea>

            </div>



            <button
              type="submit"
              id="bookingButton"
              class="booking-button"
            >

              Send Booking Request

            </button>


          </form>


          <div
            id="bookingMessage"
            class="message"
          ></div>


        </aside>


      </div>

    `;



    /* =====================================
       BOOKING FORM
    ===================================== */

    const bookingForm =
      document.getElementById(
        "bookingForm"
      );


    const bookingButton =
      document.getElementById(
        "bookingButton"
      );


    const bookingMessage =
      document.getElementById(
        "bookingMessage"
      );



    bookingForm.addEventListener(
      "submit",
      async function(event) {


        event.preventDefault();


        bookingButton.disabled =
          true;


        bookingButton.textContent =
          "Sending request...";


        bookingMessage.className =
          "message";


        try {


          const guestName =
            document
              .getElementById(
                "guestName"
              )
              .value
              .trim();


          const guestEmail =
            document
              .getElementById(
                "guestEmail"
              )
              .value
              .trim();


          const guestPhone =
            document
              .getElementById(
                "guestPhone"
              )
              .value
              .trim();


          const checkIn =
            document
              .getElementById(
                "checkIn"
              )
              .value;


          const checkOut =
            document
              .getElementById(
                "checkOut"
              )
              .value;


          const guests =
            Number(
              document
                .getElementById(
                  "guests"
                )
                .value
            );


          const guestMessage =
            document
              .getElementById(
                "guestMessage"
              )
              .value
              .trim();



          /* VALIDATE DATES */

          if (
            new Date(checkOut)
            <=
            new Date(checkIn)
          ) {

            throw new Error(
              "Check-out must be after check-in."
            );

          }



          /* VALIDATE GUESTS */

          if (
            guests < 1 ||
            guests >
            Number(
              property.max_guests
            )
          ) {

            throw new Error(
              `This property allows a maximum of ${property.max_guests} guests.`
            );

          }



          /* =================================
             CHECK BLOCKED DATES
          ================================= */

          const {

            data: blockedDates,

            error: blockedError

          } =
            await supabaseClient

              .from(
                "blocked_dates"
              )

              .select(
                "start_date, end_date"
              )

              .eq(
                "property_id",
                propertyId
              );



          if (blockedError) {

            throw blockedError;

          }



          const requestedStart =
            new Date(
              checkIn
            );


          const requestedEnd =
            new Date(
              checkOut
            );



          const overlapsBlocked =
            (blockedDates || [])
              .some(blocked => {


                const blockedStart =
                  new Date(
                    blocked.start_date
                  );


                const blockedEnd =
                  new Date(
                    blocked.end_date
                  );


                return (

                  requestedStart <
                  blockedEnd

                  &&

                  requestedEnd >
                  blockedStart

                );

              });



          if (
            overlapsBlocked
          ) {

            throw new Error(
              "Some of your selected dates are unavailable. Please choose different dates."
            );

          }



          /* =================================
             CHECK EXISTING BOOKINGS
          ================================= */

          const {

            data: existingBookings,

            error: existingError

          } =
            await supabaseClient

              .from(
                "bookings"
              )

              .select(
                "check_in, check_out, status"
              )

              .eq(
                "property_id",
                propertyId
              )

              .in(
                "status",
                [
                  "pending",
                  "confirmed"
                ]
              );



          if (existingError) {

            throw existingError;

          }



          const overlapsBooking =
            (existingBookings || [])
              .some(existing => {


                const existingStart =
                  new Date(
                    existing.check_in
                  );


                const existingEnd =
                  new Date(
                    existing.check_out
                  );


                return (

                  requestedStart <
                  existingEnd

                  &&

                  requestedEnd >
                  existingStart

                );

              });



          if (
            overlapsBooking
          ) {

            throw new Error(
              "Those dates are already requested or booked. Please choose different dates."
            );

          }



          /* =================================
             CREATE BOOKING
          ================================= */

          const {

            error: insertError

          } =
            await supaba
