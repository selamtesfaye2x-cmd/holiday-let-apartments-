<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Property | StayHaven</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .property-page {
      max-width: 1100px;
      margin: 45px auto;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      font-weight: 700;
      color: #172033;
      text-decoration: none;
    }

    /* GALLERY */

    .property-gallery {
      margin-bottom: 35px;
    }

    .main-photo {
      width: 100%;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      background: #eeeeee;
      margin-bottom: 12px;
    }

    .main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbnail-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .thumbnail {
      height: 90px;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      padding: 0;
      background: #eeeeee;
      cursor: pointer;
    }

    .thumbnail.active {
      border-color: #b88945;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-photo {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #667085;
      font-weight: 600;
    }

    /* PROPERTY */

    .property-layout {
      display: grid;
      grid-template-columns: 1.6fr 0.9fr;
      gap: 35px;
      align-items: start;
    }

    .property-type {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 20px;
      background: #f5efe7;
      color: #8b6333;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .property-info h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .location {
      color: #667085;
      margin-bottom: 20px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .details-box {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    .detail {
      background: #f8f9fb;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: #475467;
    }

    .description {
      color: #475467;
      white-space: pre-line;
    }

    /* BOOKING */

    .booking-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      padding: 25px;
      position: sticky;
      top: 20px;
    }

    .booking-card h2 {
      margin-bottom: 8px;
    }

    .booking-card p {
      color: #667085;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #b88945;
      color: white;
      padding: 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .loading,
    .error-state {
      padding: 50px 20px;
      text-align: center;
      color: #667085;
    }

    .error-state {
      color: #b42318;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .property-page {
        margin: 25px auto;
      }

      .main-photo {
        height: 280px;
      }

      .thumbnail-row {
        grid-template-columns: repeat(4, 1fr);
      }

      .thumbnail {
        height: 70px;
      }

      .property-layout {
        grid-template-columns: 1fr;
      }

      .property-info h1 {
        font-size: 34px;
      }

      .booking-card {
        position: static;
      }

    }

    @media (max-width: 500px) {

      .thumbnail-row {
        grid-template-columns: repeat(3, 1fr);
      }

    }

  </style>

</head>

<body>

<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="properties.html">
      Holiday Lets
    </a>

    <a href="login.html">
      Login
    </a>

  </nav>

</header>


<main
  id="propertyPage"
  class="property-page"
>

  <div class="loading">
    Loading property...
  </div>

</main>


<footer>

  <div class="footer-logo">
    StayHaven
  </div>

  <p>
    Discover places worth staying for.
  </p>

  <p class="copyright">
    © 2026 StayHaven. All rights reserved.
  </p>

</footer>


<script src="supabase.js"></script>


<script>

let currentProperty = null;


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   CURRENCY
========================================= */

function formatCurrency(amount, currency) {

  const safeCurrency = currency || "GBP";

  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 2
      }
    ).format(Number(amount) || 0);

  } catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0).toFixed(2)
    );

  }

}


/* =========================================
   RENTAL INFO
========================================= */

function getRentalInfo(property) {

  const type =
    String(
      property.property_type || "holiday_let"
    )
    .toLowerCase()
    .trim();


  if (type === "long_term_rental") {

    return {
      name: "Long-Term Rental",
      unit: "month",
      price:
        property.price_per_month ||
        property.price_per_night ||
        0
    };

  }


  if (type === "short_term_rental") {

    return {
      name: "Short-Term Rental",
      unit: "night",
      price:
        property.price_per_night ||
        property.price_per_day ||
        0
    };

  }


  return {
    name: "Holiday Let",
    unit: "night",
    price:
      property.price_per_night || 0
  };

}


/* =========================================
   GET PROPERTY IMAGES
========================================= */

function getPropertyImages(property) {

  let images = property.image_urls;


  /* JSON string */

  if (typeof images === "string") {

    try {

      images = JSON.parse(images);

    } catch (error) {

      /* Sometimes a single URL is stored */

      if (
        images.trim().startsWith("[") &&
        images.trim().endsWith("]")
      ) {

        images =
          images
            .replace("[", "")
            .replace("]", "")
            .split(",");

      } else {

        images = [images];

      }

    }

  }


  /* Object containing URLs */

  if (
    images &&
    !Array.isArray(images) &&
    typeof images === "object"
  ) {

    images =
      Object.values(images);

  }


  if (!Array.isArray(images)) {

    images = [];

  }


  /* Clean URLs */

  images =
    images
      .map(function(url) {

        return String(url || "")
          .trim()
          .replace(/^["']|["']$/g, "");

      })
      .filter(function(url) {

        return (
          url.startsWith("http://") ||
          url.startsWith("https://")
        );

      });


  return images;

}


/* =========================================
   IMAGE ERROR HANDLING
========================================= */

function handleImageError(image) {

  image.style.display = "none";

  const parent =
    image.parentElement;

  if (!parent) {
    return;
  }

  if (
    parent.querySelector(
      ".image-error"
    )
  ) {

    return;

  }

  const errorText =
    document.createElement("div");

  errorText.className =
    "no-photo image-error";

  errorText.textContent =
    "Photo unavailable";

  parent.appendChild(
    errorText
  );

}


/* =========================================
   GALLERY
========================================= */

function renderGallery(images) {

  if (
    !images ||
    images.length === 0
  ) {

    return `

      <div class="property-gallery">

        <div class="main-photo">

          <div class="no-photo">
            No property photos available
          </div>

        </div>

      </div>

    `;

  }


  const thumbnails =
    images
      .map(function(image, index) {

        return `

          <button
            type="button"
            class="thumbnail ${
              index === 0
                ? "active"
                : ""
            }"
            data-image-index="${index}"
          >

            <img
              src="${escapeHtml(image)}"
              alt="Property photo ${index + 1}"
              loading="${
                index === 0
                  ? "eager"
                  : "lazy"
              }"
              onerror="handleImageError(this)"
            >

          </button>

        `;

      })
      .join("");


  return `

    <div class="property-gallery">

      <div class="main-photo">

        <img
          id="mainPropertyPhoto"
          src="${escapeHtml(images[0])}"
          alt="Property photo"
          onerror="handleImageError(this)"
        >

      </div>

      <div class="thumbnail-row">

        ${thumbnails}

      </div>

    </div>

  `;

}


/* =========================================
   THUMBNAIL EVENTS
========================================= */

function setupGallery() {

  const thumbnails =
    document.querySelectorAll(
      ".thumbnail"
    );


  thumbnails.forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          const index =
            Number(
              button.dataset.imageIndex
            );

          changeMainPhoto(index);

        }
      );

    }
  );

}


/* =========================================
   CHANGE MAIN PHOTO
========================================= */

function changeMainPhoto(index) {

  if (!currentProperty) {
    return;
  }


  const images =
    getPropertyImages(
      currentProperty
    );


  if (!images[index]) {
    return;
  }


  const mainPhoto =
    document.getElementById(
      "mainPropertyPhoto"
    );


  if (!mainPhoto) {
    return;
  }


  mainPhoto.style.display =
    "block";


  mainPhoto.src =
    images[index];


  const thumbnails =
    document.querySelectorAll(
      ".thumbnail"
    );


  thumbnails.forEach(
    function(button, buttonIndex) {

      button.classList.toggle(
        "active",
        buttonIndex === index
      );

    }
  );

}


/* =========================================
   LOAD PROPERTY
========================================= */

async function loadProperty() {

  const page =
    document.getElementById(
      "propertyPage"
    );


  try {

    if (
      typeof supabaseClient ===
      "undefined"
    ) {

      throw new Error(
        "Supabase connection is unavailable."
      );

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const propertyId =
      params.get("id");


    if (!propertyId) {

      throw new Error(
        "No property was selected."
      );

    }


    const {
      data: property,
      error
    } =
      await supabaseClient
        .from("properties")
        .select("*")
        .eq("id", propertyId)
        .single();


    if (error) {
      throw error;
    }


    if (!property) {

      throw new Error(
        "Property not found."
      );

    }


    currentProperty =
      property;


    const rental =
      getRentalInfo(
        property
      );


    const formattedPrice =
      formatCurrency(
        rental.price,
        property.currency
      );


    const images =
      getPropertyImages(
        property
      );


    page.innerHTML = `

      <a
        href="properties.html"
        class="back-link"
      >
        ← Back to Properties
      </a>

      ${renderGallery(images)}

      <div class="property-layout">

        <section class="property-info">

          <span class="property-type">
            ${escapeHtml(rental.name)}
          </span>

          <h1>
            ${escapeHtml(property.name)}
          </h1>

          <p class="location">
            📍
            ${escapeHtml(
              property.location ||
              "Location not provided"
            )}
          </p>

          <p class="price">

            ${escapeHtml(formattedPrice)}

            per

            ${escapeHtml(rental.unit)}

          </p>

          <div class="details-box">

            <div class="detail">
              🛏️
              ${escapeHtml(
                property.bedrooms ?? "—"
              )}
              Bedrooms
            </div>

            <div class="detail">
              🚿
              ${escapeHtml(
                property.bathrooms ?? "—"
              )}
              Bathrooms
            </div>

            <div class="detail">
              👥 Up to
              ${escapeHtml(
                property.max_guests ?? "—"
              )}
              Guests
            </div>

          </div>

          <h2>
            About this property
          </h2>

          <p class="description">

            ${escapeHtml(
              property.description ||
              "No description provided."
            )}

          </p>

        </section>


        <aside class="booking-card">

          <h2>
            Request a Booking
          </h2>

          <p>
            Send your request directly to the property owner.
          </p>


          <form id="bookingForm">

            <div class="form-group">

              <label for="guestName">
                Full Name
              </label>

              <input
                type="text"
                id="guestName"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestEmail">
                Email Address
              </label>

              <input
                type="email"
                id="guestEmail"
                required
              >

            </div>


            <div class="form-group">

              <label for="guestPhone">
                Phone Number
              </label>

              <input
                type="tel"
                id="guestPhone"
              >

            </div>


            <div class="form-group">

              <label for="checkIn">
                Check-in
              </label>

              <input
                type="date"
                id="checkIn"
                required
              >

            </div>


            <div class="form-group">

              <label for="checkOut">
                Check-out
              </label>

              <input
                type="date"
                id="checkOut"
                required
              >

            </div>


            <div class="form-group">

              <label for="guests">
                Number of Guests
              </label>

              <input
                type="number"
                id="guests"
                min="1"
                value="1"
                required
              >

            </div>


            <div class="form-group">

              <label for="bookingMessage">
                Message
              </label>

              <textarea
                id="bookingMessage"
                placeholder="Tell the owner about your stay..."
              ></textarea>

            </div>


            <button
              type="submit"
              id="bookingButton"
              class="submit-button"
            >
              Send Booking Request
            </button>

          </form>


          <div
            id="bookingMessageBox"
            class="message"
          ></div>

        </aside>

      </div>

    `;


    setupGallery();

    setupBookingForm();

  }


  catch (error) {

    console.error(
      "PROPERTY ERROR:",
      error
    );


    page.innerHTML = `

      <div class="error-state">

        <h2>
          Unable to load property
        </h2>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

        <br>

        <a
          href="properties.html"
          class="primary-button"
        >
          Back to Properties
        </a>

      </div>

    `;

  }

}


/* =========================================
   BOOKING FORM
========================================= */

function setupBookingForm() {

  const bookingForm =
    document.getElementById(
      "bookingForm"
    );


  if (!bookingForm) {
    return;
  }


  const bookingButton =
    document.getElementById(
      "bookingButton"
    );


  const messageBox =
    document.getElementById(
      "bookingMessageBox"
    );


  const checkIn =
    document.getElementById(
      "checkIn"
    );


  const checkOut =
    document.getElementById(
      "checkOut"
    );


  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  checkIn.min =
    today;


  checkOut.min =
    today;


  checkIn.addEventListener(
    "change",
    function() {

      if (checkIn.value) {

        checkOut.min =
          checkIn.value;

      }

    }
  );


  bookingForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      bookingButton.disabled =
        true;


      bookingButton.textContent =
        "Sending...";


      messageBox.className =
        "message";


      try {

        const guestName =
          document
            .getElementById(
              "guestName"
            )
            .value
            .trim();


        const guestEmail =
          document
            .getElementById(
              "guestEmail"
            )
            .value
            .trim();


        const guestPhone =
          document
            .getElementById(
              "guestPhone"
            )
            .value
            .trim();


        const checkInDate =
          checkIn.value;


        const checkOutDate =
          checkOut.value;


        const guests =
          Number(
            document
              .getElementById(
                "guests"
              )
              .value
          );


        const guestMessage =
          document
            .getElementById(
              "bookingMessage"
            )
            .value
            .trim();


        if (
          !guestName ||
          !guestEmail ||
          !checkInDate ||
          !checkOutDate
        ) {

          throw new Error(
            "Please complete all required fields."
          );

        }


        if (
          new Date(checkOutDate) <=
          new Date(checkInDate)
        ) {

          throw new Error(
            "Check-out must be after check-in."
          );

        }


                if (
          !Number.isFinite(guests) ||
          guests < 1
        ) {

          throw new Error(
            "Please enter a valid number of guests."
          );

        }


        if (
          currentProperty.max_guests &&
          guests >
          Number(
            currentProperty.max_guests
          )
        ) {

          throw new Error(
            "The number of guests exceeds the property's maximum capacity."
          );

        }


        /* =====================================
           SAVE BOOKING
        ===================================== */

        const {
          error
        } =
          await supabaseClient
            .from("bookings")
            .insert({

              property_id:
                currentProperty.id,

              guest_name:
                guestName,

              guest_email:
                guestEmail,

              guest_phone:
                guestPhone ||
                null,

              check_in:
                checkInDate,

              check_out:
                checkOutDate,

              guests:
                guests,

              message:
                guestMessage ||
                null,

              status:
                "pending"

            });


        if (error) {

          throw error;

        }


        /* =====================================
           SUCCESS
        ===================================== */

        messageBox.textContent =
          "Booking request sent successfully. The property owner will review your request.";

        messageBox.className =
          "message success";


        bookingForm.reset();


        checkIn.min =
          today;

        checkOut.min =
          today;

      }


      catch (error) {

        console.error(
          "BOOKING ERROR:",
          error
        );


        messageBox.textContent =
          error.message ||
          "Unable to send booking request.";

        messageBox.className =
          "message error";

      }


      finally {

        bookingButton.disabled =
          false;

        bookingButton.textContent =
          "Send Booking Request";

      }

    }
  );

}


/* =========================================
   START PROPERTY PAGE
========================================= */

loadProperty();

</script>

</body>

</html>
