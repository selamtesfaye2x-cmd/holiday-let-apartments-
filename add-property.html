<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Property | StayHaven UK</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">

  <div class="logo">
    StayHaven<span>UK</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

</header>


<main style="max-width:800px;margin:50px auto;padding:20px;">

  <div style="margin-bottom:35px;">

    <p class="eyebrow">PROPERTY MANAGEMENT</p>

    <h1>Add your holiday property</h1>

    <p style="color:#667085;margin-top:8px;">
      Add the details guests will see when viewing your property.
    </p>

  </div>


  <form id="propertyForm">


    <!-- PROPERTY NAME -->

    <label>Property Name</label>

    <input
      type="text"
      id="name"
      placeholder="Example: Luxury Cottage by the Sea"
      required
      style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #ddd;border-radius:7px;"
    >


    <!-- LOCATION -->

    <label>Location</label>

    <input
      type="text"
      id="location"
      placeholder="Example: Cornwall, UK"
      required
      style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #ddd;border-radius:7px;"
    >


    <!-- DESCRIPTION -->

    <label>Description</label>

    <textarea
      id="description"
      rows="6"
      placeholder="Tell guests about your property..."
      required
      style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #ddd;border-radius:7px;resize:vertical;"
    ></textarea>


    <!-- GUESTS / BEDROOMS / BATHROOMS -->

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;">

      <div>

        <label>Max Guests</label>

        <input
          type="number"
          id="maxGuests"
          min="1"
          value="6"
          required
          style="width:100%;padding:14px;margin-top:8px;border:1px solid #ddd;border-radius:7px;"
        >

      </div>


      <div>

        <label>Bedrooms</label>

        <input
          type="number"
          id="bedrooms"
          min="1"
          value="3"
          required
          style="width:100%;padding:14px;margin-top:8px;border:1px solid #ddd;border-radius:7px;"
        >

      </div>


      <div>

        <label>Bathrooms</label>

        <input
          type="number"
          id="bathrooms"
          min="1"
          value="2"
          required
          style="width:100%;padding:14px;margin-top:8px;border:1px solid #ddd;border-radius:7px;"
        >

      </div>

    </div>


    <!-- PRICE -->

    <div style="margin-top:20px;">

      <label>Price per Night (£)</label>

      <input
        type="number"
        id="price"
        min="1"
        step="0.01"
        value="150"
        required
        style="width:100%;padding:14px;margin:8px 0 25px;border:1px solid #ddd;border-radius:7px;"
      >

    </div>


    <button
      type="submit"
      class="primary-button"
      style="border:0;cursor:pointer;width:100%;"
    >
      Add Property
    </button>


  </form>


  <p
    id="message"
    style="text-align:center;margin-top:20px;"
  ></p>


</main>


<script src="supabase.js"></script>


<script>

const propertyForm =
  document.getElementById("propertyForm");

const message =
  document.getElementById("message");


async function checkUser() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    window.location.href = "login.html";

    return null;

  }


  return user;

}


propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    message.textContent =
      "Adding property...";

    message.style.color =
      "#667085";


    try {

      const user =
        await checkUser();


      if (!user) return;


      const name =
        document.getElementById("name").value.trim();


      const location =
        document.getElementById("location").value.trim();


      const description =
        document.getElementById("description").value.trim();


      const maxGuests =
        Number(
          document.getElementById("maxGuests").value
        );


      const bedrooms =
        Number(
          document.getElementById("bedrooms").value
        );


      const bathrooms =
        Number(
          document.getElementById("bathrooms").value
        );


      const price =
        Number(
          document.getElementById("price").value
        );


      const {
        data,
        error
      } = await supabaseClient

        .from("properties")

        .insert({

          owner_id: user.id,

          name: name,

          location: location,

          description: description,

          max_guests: maxGuests,

          bedrooms: bedrooms,

          bathrooms: bathrooms,

          price_per_night: price

        })

        .select();


      if (error) {

        throw error;

      }


      message.textContent =
        "Property added successfully!";

      message.style.color =
        "green";


      propertyForm.reset();


      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(error);


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.style.color =
        "red";

    }

  });


checkUser();

</script>

</body>
  </html>
