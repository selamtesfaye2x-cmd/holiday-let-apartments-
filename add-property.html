/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
"https://hbuoucmdgtwryahlnjzf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OqqklL691qHVkDvkZisQ5w_IhepZwCb";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================================
   ELEMENTS
================================================= */

const form =
document.getElementById("propertyForm");

const propertyType =
document.getElementById("propertyType");

const price =
document.getElementById("price");

const priceHelp =
document.getElementById("priceHelp");

const submitButton =
document.getElementById("submitButton");

const message =
document.getElementById("message");


/* =================================================
   UPDATE PRICE HELP
================================================= */

function updatePriceHelp() {

const type =
propertyType.value;


if (type === "long_term_rental") {

price.placeholder = "1200";

priceHelp.textContent =
"Long-term rentals are charged per month.";

}

else if (type === "short_term_rental") {

price.placeholder = "150";

priceHelp.textContent =
"Short-term rentals are charged per night.";

}

else {

price.placeholder = "150";

priceHelp.textContent =
"Holiday lets are charged per night.";

}

}


/*
IMPORTANT:

This only changes the text.

It does NOT redirect anywhere.
*/

propertyType.addEventListener(
"change",
updatePriceHelp
);


/* =================================================
   SHOW MESSAGE
================================================= */

function showMessage(
text,
type
) {

message.textContent =
text;

message.className =
"message " + type;

}


/* =================================================
   SUBMIT FORM
================================================= */

form.addEventListener(
"submit",
async function(event) {


/*
STOP normal browser form submission.
*/

event.preventDefault();


submitButton.disabled =
true;

submitButton.textContent =
"Adding property...";


message.className =
"message";


try {


/* =================================================
   CHECK LOGIN
================================================= */

const {
data: {
user
},
error: userError
} =
await supabaseClient
.auth
.getUser();


if (userError) {

throw userError;

}


if (!user) {

throw new Error(
"You must be logged in to add a property."
);

}


/* =================================================
   GET FORM VALUES
================================================= */

const type =
propertyType.value;

const name =
document
.getElementById("propertyName")
.value
.trim();

const location =
document
.getElementById("location")
.value
.trim();

const rentalPrice =
Number(
price.value
);

const currency =
document
.getElementById("currency")
.value;

const bedrooms =
Number(
document
.getElementById("bedrooms")
.value
);

const bathrooms =
Number(
document
.getElementById("bathrooms")
.value
);

const maxGuests =
Number(
document
.getElementById("maxGuests")
.value
);

const description =
document
.getElementById("description")
.value
.trim();


/* =================================================
   VALIDATION
================================================= */

if (!name) {

throw new Error(
"Please enter the property name."
);

}


if (!location) {

throw new Error(
"Please enter the property location."
);

}


if (
!Number.isFinite(rentalPrice) ||
rentalPrice < 0
) {

throw new Error(
"Please enter a valid rental price."
);

}


if (
!Number.isInteger(bedrooms) ||
bedrooms < 0
) {

throw new Error(
"Please enter a valid number of bedrooms."
);

}


if (
!Number.isFinite(bathrooms) ||
bathrooms < 0
) {

throw new Error(
"Please enter a valid number of bathrooms."
);

}


if (
!Number.isInteger(maxGuests) ||
maxGuests < 1
) {

throw new Error(
"Maximum guests must be at least 1."
);

}


if (!description) {

throw new Error(
"Please enter a property description."
);

}


/* =================================================
   BUILD DATABASE RECORD
================================================= */

const propertyData = {

owner_id:
user.id,

name:
name,

location:
location,

description:
description,

property_type:
type,

currency:
currency,

bedrooms:
bedrooms,

bathrooms:
bathrooms,

max_guests:
maxGuests

};


/*
LONG TERM:

price_per_month

HOLIDAY / SHORT TERM:

price_per_night
*/

if (
type === "long_term_rental"
) {

propertyData.price_per_month =
rentalPrice;

}

else {

propertyData.price_per_night =
rentalPrice;

}


/* =================================================
   INSERT
================================================= */

const {
error: insertError
} =
await supabaseClient

.from("properties")

.insert(
propertyData
);


if (insertError) {

throw insertError;

}


/* =================================================
   SUCCESS
================================================= */

showMessage(
"Property added successfully!",
"success"
);


/*
ONLY NOW do we redirect.
*/

setTimeout(
function() {

window.location.href =
"dashboard.html";

},
1200
);


}

catch (error) {


console.error(
"ADD PROPERTY ERROR:",
error
);


showMessage(
error.message ||
"Unable to add property.",
"error"
);


submitButton.disabled =
false;

submitButton.textContent =
"Add Property";

}

});


/* =================================================
   INITIAL
================================================= */

updatePriceHelp();

</script></body></html>
