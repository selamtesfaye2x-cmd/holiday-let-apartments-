<h1>
  Add a Property
</h1>


<p class="intro">
  Create a listing and make it available to guests.
</p>



<form id="propertyForm">


  <!-- PROPERTY TYPE -->

  <div class="form-group">

    <label for="propertyType">
      Property Type
    </label>


    <select
      id="propertyType"
      name="propertyType"
      required
    >

      <option value="holiday_let">
        Holiday Let
      </option>

      <option value="short_term_rental">
        Short-Term Rental
      </option>

      <option value="long_term_rental">
        Long-Term Rental
      </option>

    </select>


    <div class="type-help">
      Choose the type of property you are listing.
    </div>

  </div>



  <!-- PROPERTY NAME -->

  <div class="form-group">

    <label for="propertyName">
      Property Name
    </label>


    <input
      type="text"
      id="propertyName"
      name="propertyName"
      placeholder="e.g. Luxury Lakeside Villa"
      autocomplete="off"
      required
    >

  </div>



  <!-- LOCATION -->

  <div class="form-group">

    <label for="location">
      Location
    </label>


    <input
      type="text"
      id="location"
      name="location"
      placeholder="City, Country"
      autocomplete="off"
      required
    >

  </div>



  <!-- PRICE + CURRENCY -->

  <div class="two-column">


    <div class="form-group">

      <label for="price">
        Rental Price
      </label>


      <input
        type="number"
        id="price"
        name="price"
        min="0"
        step="0.01"
        placeholder="150"
        required
      >


      <div
        id="priceHelp"
        class="price-help"
      >
        Holiday lets are charged per night.
      </div>

    </div>



    <div class="form-group">

      <label for="currency">
        Currency
      </label>


      <select
        id="currency"
        name="currency"
        required
      >

        <option value="GBP">
          GBP (£) — British Pound
        </option>

        <option value="CAD">
          CAD (CA$) — Canadian Dollar
        </option>

        <option value="USD">
          USD ($) — US Dollar
        </option>

        <option value="EUR">
          EUR (€) — Euro
        </option>

        <option value="AUD">
          AUD (A$) — Australian Dollar
        </option>

        <option value="NZD">
          NZD (NZ$) — New Zealand Dollar
        </option>

        <option value="CHF">
          CHF (CHF) — Swiss Franc
        </option>

        <option value="ZAR">
          ZAR (R) — South African Rand
        </option>

        <option value="KES">
          KES (KSh) — Kenyan Shilling
        </option>

      </select>

    </div>


  </div>



  <!-- PROPERTY DETAILS -->

  <div class="three-column">


    <div class="form-group">

      <label for="bedrooms">
        Bedrooms
      </label>


      <input
        type="number"
        id="bedrooms"
        name="bedrooms"
        min="0"
        step="1"
        value="1"
        required
      >

    </div>



    <div class="form-group">

      <label for="bathrooms">
        Bathrooms
      </label>


      <input
        type="number"
        id="bathrooms"
        name="bathrooms"
        min="0"
        step="0.5"
        value="1"
        required
      >

    </div>



    <div class="form-group">

      <label for="maxGuests">
        Maximum Guests
      </label>


      <input
        type="number"
        id="maxGuests"
        name="maxGuests"
        min="1"
        step="1"
        value="2"
        required
      >

    </div>


  </div>



  <!-- DESCRIPTION -->

  <div class="form-group">

    <label for="description">
      Description
    </label>


    <textarea
      id="description"
      name="description"
      placeholder="Describe the property, amenities, location and anything guests should know..."
      required
    ></textarea>

  </div>



  <!-- SUBMIT -->

  <button
    type="submit"
    id="submitButton"
    class="submit-button"
  >
    Add Property
  </button>


</form>



<div
  id="message"
  class="message"
  role="alert"
></div>

  </div></main><script src="supabase.js"></script><script>

/* ==================================================
   CHECK SUPABASE
================================================== */

if (
  typeof supabaseClient === "undefined"
) {

  document.getElementById("message").textContent =
    "Supabase could not be loaded. Please check supabase.js.";

  document.getElementById("message").className =
    "message error";

}


/* ==================================================
   ELEMENTS
================================================== */

const propertyForm =
  document.getElementById("propertyForm");

const submitButton =
  document.getElementById("submitButton");

const message =
  document.getElementById("message");

const propertyType =
  document.getElementById("propertyType");

const priceInput =
  document.getElementById("price");

const priceHelp =
  document.getElementById("priceHelp");

const currency =
  document.getElementById("currency");


/* ==================================================
   PRICE INFORMATION
================================================== */

function updatePriceLabel() {

  const type =
    propertyType.value;


  if (
    type === "long_term_rental"
  ) {

    priceInput.placeholder =
      "1200";

    priceHelp.textContent =
      "Long-term rentals are charged per month.";

  }


  else if (
    type === "short_term_rental"
  ) {

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Short-term rentals are charged per night.";

  }


  else {

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Holiday lets are charged per night.";

  }

}


/*
IMPORTANT:

This only changes the text on the page.

It does NOT redirect anywhere.
*/

propertyType.addEventListener(
  "change",
  updatePriceLabel
);


/* ==================================================
   FORM SUBMISSION
================================================== */

propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    submitButton.disabled =
      true;

    submitButton.textContent =
      "Adding property...";


    message.className =
      "message";


    try {


      /* ==========================================
         CHECK SUPABASE
      ========================================== */

      if (
        typeof supabaseClient === "undefined"
      ) {

        throw new Error(
          "Supabase client is not available. Check supabase.js."
        );

      }



      /* ==========================================
         GET CURRENT USER
      ========================================== */

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient
          .auth
          .getUser();


      if (userError) {

        throw userError;

      }


      if (!user) {

        throw new Error(
          "You must be logged in to add a property."
        );

      }



      /* ==========================================
         GET FORM VALUES
      ========================================== */

      const type =
        propertyType.value;


      const name =
        document
          .getElementById("propertyName")
          .value
          .trim();


      const location =
        document
          .getElementById("location")
          .value
          .trim();


      const price =
        Number(
          priceInput.value
        );


      const currencyValue =
        currency.value;


      const bedrooms =
        Number(
          document
            .getElementById("bedrooms")
            .value
        );


      const bathrooms =
        Number(
          document
            .getElementById("bathrooms")
            .value
        );


      const maxGuests =
        Number(
          document
            .getElementById("maxGuests")
            .value
        );


      const description =
        document
          .getElementById("description")
          .value
          .trim();



      /* ==========================================
         VALIDATION
      ========================================== */

      if (!name) {

        throw new Error(
          "Please enter the property name."
        );

      }


      if (!location) {

        throw new Error(
          "Please enter the property location."
        );

      }


      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        throw new Error(
          "Please enter a valid rental price."
        );

      }


      if (
        !Number.isFinite(bedrooms) ||
        bedrooms < 0
      ) {

        throw new Error(
          "Please enter a valid number of bedrooms."
        );

      }


      if (
        !Number.isFinite(bathrooms) ||
        bathrooms < 0
      ) {

        throw new Error(
          "Please enter a valid number of bathrooms."
        );

      }


      if (
        !Number.isFinite(maxGuests) ||
        maxGuests < 1
      ) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }


      if (!description) {

        throw new Error(
          "Please enter a property description."
        );

      }



      /* ==========================================
         BUILD DATABASE RECORD
      ========================================== */

      const propertyData = {

        owner_id:
          user.id,

        name:
          name,

        location:
          location,

        currency:
          currencyValue,

        bedrooms:
          bedrooms,

        bathrooms:
          bathrooms,

        max_guests:
          maxGuests,

        description:
          description,

        property_type:
          type

      };



      /*
        Holiday Let
        Short-Term Rental
        -> price_per_night

        Long-Term Rental
        -> price_per_month
      */

      if (
        type === "long_term_rental"
      ) {

        propertyData.price_per_month =
          price;

      }

      else {

        propertyData.price_per_night =
          price;

      }



      /* ==========================================
         INSERT PROPERTY
      ========================================== */

      const {
        data: property,
        error
      } =
        await supabaseClient

          .from("properties")

          .insert(propertyData)

          .select()

          .single();


      if (error) {

        throw error;

      }



      /* ==========================================
         SUCCESS
      ========================================== */

      message.textContent =
        "Property added successfully!";

      message.className =
        "message success";


      /*
        Reset the form after successful
        database insertion.
      */

      propertyForm.reset();


      propertyType.value =
        "holiday_let";


      currency.value =
        "GBP";


      updatePriceLabel();



      /*
        Return to dashboard after
        successful submission only.
      */

      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        1200
      );


    }


    catch (error) {


      console.error(
        "ADD PROPERTY ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.className =
        "message error";


      /*
        Stay on the Add Property page
        when there is an error.
      */

    }


    finally {

      submitButton.disabled =
        false;

      submitButton.textContent =
        "Add Property";

    }

  });


/* ==================================================
   INITIAL PRICE LABEL
================================================== */

updatePriceLabel();

</script></body></html>
