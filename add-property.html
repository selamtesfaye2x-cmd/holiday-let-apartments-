<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StayHaven - Add Property</title><style>

body {
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 30px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
}

h1 {
  margin-top: 0;
}

.field {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
textarea,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

textarea {
  min-height: 120px;
}

.types {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.types button {
  padding: 15px;
  border: 2px solid #ccc;
  background: white;
  border-radius: 8px;
  cursor: pointer;
}

.types button.selected {
  border-color: #b88945;
  background: #faf4ea;
}

#selectedType {
  margin-top: 10px;
  font-weight: bold;
}

button.submit {
  width: 100%;
  padding: 15px;
  background: #172033;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

</style></head><body><div class="container"><h1>
Add a Property
</h1><p>
Test page — select a property type and fill in the details.
</p><div class="field"><label>
Property Type
</label><div class="types"><button
type="button"
onclick="selectType('Holiday Let', this)"

«»

Holiday Let
</button>

<button
type="button"
onclick="selectType('Short-Term Rental', this)"

«»

Short-Term Rental
</button>

<button
type="button"
onclick="selectType('Long-Term Rental', this)"

«»

Long-Term Rental
</button>

</div><div id="selectedType">
Selected: Holiday Let
</div></div><div class="field"><label for="name">
Property Name
</label><input
id="name"
type="text"
placeholder="Luxury Villa"

«»

</div><div class="field"><label for="price">
Rental Price
</label><input
id="price"
type="number"
placeholder="150"

«»

</div><div class="field"><label for="location">
Location
</label><input
id="location"
type="text"
placeholder="London, UK"

«»

</div><div class="field"><label for="guests">
Maximum Guests
</label><input
id="guests"
type="number"
value="2"

«»

</div><div class="field"><label for="description">
Description
</label><textarea
  id="description"
  placeholder="Describe your property..."
></textarea></div><button
type="button"
class="submit"
onclick="alert('Test successful — no redirect is configured on this page.')"

«»

Test Property
</button>

</div><script>

function selectType(type, button) {

  document
    .querySelectorAll(".types button")
    .forEach(function(item) {

      item.classList.remove("selected");

    });


  button.classList.add("selected");


  document.getElementById(
    "selectedType"
  ).textContent =
    "Selected: " + type;

}

</script></body></html>
