.rental-option label:hover {
  border-color: #b88945;

}

.type-description {

.submit-button {

  border: 0;
  background: #b88945;

  cursor: pointer;

  font-weight: 700;
}

.submit-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 7px;
  font-size: 14px;
}

.message.success {
  display: block;
  background: #e7f6ec;
  color: #217a3a;
}

.message.error {
  display: block;
  background: #fdecec;
  color: #b42318;
}

.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #172033;
  text-decoration: none;
  font-weight: 700;
}

@media (max-width: 700px) {

  .two-column,
  .three-column,
  .rental-options {
    grid-template-columns: 1fr;
  }

  .form-card {
    padding: 22px;
  }

}

/* =========================================
   ELEMENTS
========================================= */

const propertyForm =
document.getElementById("propertyForm");

const submitButton =
document.getElementById("submitButton");

const message =
document.getElementById("message");

const priceInput =
document.getElementById("price");

const priceHelp =
document.getElementById("priceHelp");

const typeDescription =
document.getElementById("typeDescription");



/* =========================================
   GET PROPERTY TYPE
========================================= */

function getPropertyType() {

const selected =
document.querySelector(
'input[name="propertyType"]:checked'
);

return selected
? selected.value
: "holiday_let";

}



/* =========================================
   UPDATE TYPE
========================================= */

function updatePropertyType() {

const type =
getPropertyType();


if (
type === "long_term_rental"
) {

priceInput.placeholder =
"1200";

priceHelp.textContent =
"Long-term rentals are charged per month.";

typeDescription.textContent =
"Ideal for apartments, houses and other residential rentals.";

}

else if (
type === "short_term_rental"
) {

priceInput.placeholder =
"150";

priceHelp.textContent =
"Short-term rentals are charged per night.";

typeDescription.textContent =
"Suitable for short stays and flexible accommodation.";

}

else {

priceInput.placeholder =
"150";

priceHelp.textContent =
"Holiday lets are charged per night.";

typeDescription.textContent =
"Ideal for holiday homes, villas, cottages and vacation properties.";

}

}



/* =========================================
   RENTAL TYPE CHANGE
========================================= */

document
.querySelectorAll(
'input[name="propertyType"]'
)
.forEach(function(input) {

input.addEventListener(
"change",
function() {

updatePropertyType();

}
);

});



/* =========================================
   SUBMIT
========================================= */

propertyForm.addEventListener(
"submit",
async function(event) {

event.preventDefault();


submitButton.disabled =
true;

submitButton.textContent =
"Adding property...";


message.className =
"message";


try {


/* SUPABASE CHECK */

if (
typeof supabaseClient ===
"undefined"
) {

throw new Error(
"Supabase is not configured correctly. Check supabase.js."
);

}



/* USER */

const {
data: {
user
},
error: userError
} =
await supabaseClient.auth.getUser();


if (userError) {

throw userError;

}


if (!user) {

window.location.href =
"login.html";

return;

}



/* VALUES */

const type =
getPropertyType();

const name =
document
.getElementById("propertyName")
.value
.trim();

const location =
document
.getElementById("location")
.value
.trim();

const price =
Number(
priceInput.value
);

const currency =
document
.getElementById("currency")
.value;

const bedrooms =
Number(
document
.getElementById("bedrooms")
.value
);

const bathrooms =
Number(
document
.getElementById("bathrooms")
.value
);

const maxGuests =
Number(
document
.getElementById("maxGuests")
.value
);

const description =
document
.getElementById("description")
.value
.trim();



/* VALIDATION */

if (!name) {

throw new Error(
"Please enter the property name."
);

}

if (!location) {

throw new Error(
"Please enter the property location."
);

}

if (
!Number.isFinite(price) ||
price < 0
) {

throw new Error(
"Please enter a valid rental price."
);

}

if (bedrooms < 0) {

throw new Error(
"Bedrooms cannot be negative."
);

}

if (bathrooms < 0) {

throw new Error(
"Bathrooms cannot be negative."
);

}

if (maxGuests < 1) {

throw new Error(
"Maximum guests must be at least 1."
);

}



/* DATABASE RECORD */

const propertyData = {

owner_id:
user.id,

name:
name,

location:
location,

currency:
currency,

bedrooms:
bedrooms,

bathrooms:
bathrooms,

max_guests:
maxGuests,

description:
description,

property_type:
type

};



/* PRICE */

if (
type === "long_term_rental"
) {

propertyData.price_per_month =
price;

}

else {

propertyData.price_per_night =
price;

}



/* INSERT */

const {
error
} =
await supabaseClient
.from("properties")
.insert(propertyData);


if (error) {

throw error;

}



/* SUCCESS */

message.textContent =
"Property added successfully!";

message.className =
"message success";


setTimeout(
function() {

window.location.href =
"dashboard.html";

},
1200
);


}

catch (error) {

console.error(
"ADD PROPERTY ERROR:",
error
);

message.textContent =
error.message ||
"Unable to add property.";

message.className =
"message error";

submitButton.disabled =
false;

submitButton.textContent =
"Add Property";

}

}
);


/* INITIAL */

updatePropertyType();

</script></body></html>
