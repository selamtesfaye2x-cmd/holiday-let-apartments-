  </a>  <div class="form-card"><p class="eyebrow">
  PROPERTY LISTING
</p>

<h1>
  Add a Property
</h1>

<p class="intro">
  Create a listing and make it available to guests.
</p>


<form id="propertyForm">


  <div class="form-group">

    <label for="propertyType">
      Property Type
    </label>

    <select id="propertyType">

      <option value="holiday_let">
        Holiday Let
      </option>

      <option value="short_term_rental">
        Short-Term Rental
      </option>

      <option value="long_term_rental">
        Long-Term Rental
      </option>

    </select>

  </div>


  <div class="form-group">

    <label for="propertyName">
      Property Name
    </label>

    <input
      type="text"
      id="propertyName"
      placeholder="e.g. Luxury Lakeside Villa"
      required
    >

  </div>


  <div class="form-group">

    <label for="location">
      Location
    </label>

    <input
      type="text"
      id="location"
      placeholder="City, Country"
      required
    >

  </div>


  <div class="two-column">

    <div class="form-group">

      <label for="price">
        Rental Price
      </label>

      <input
        type="number"
        id="price"
        min="0"
        step="0.01"
        placeholder="150"
        required
      >

      <div
        id="priceHelp"
        class="price-help"
      >
        Holiday lets are charged per night.
      </div>

    </div>


    <div class="form-group">

      <label for="currency">
        Currency
      </label>

      <select id="currency">

        <option value="GBP">GBP (£)</option>
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="KES">KES (KSh)</option>
        <option value="CAD">CAD (CA$)</option>
        <option value="AUD">AUD (A$)</option>

      </select>

    </div>

  </div>


  <div class="three-column">

    <div class="form-group">

      <label for="bedrooms">
        Bedrooms
      </label>

      <input
        type="number"
        id="bedrooms"
        min="0"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="bathrooms">
        Bathrooms
      </label>

      <input
        type="number"
        id="bathrooms"
        min="0"
        step="0.5"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="maxGuests">
        Maximum Guests
      </label>

      <input
        type="number"
        id="maxGuests"
        min="1"
        value="2"
        required
      >

    </div>

  </div>


  <div class="form-group">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      placeholder="Describe the property..."
      required
    ></textarea>

  </div>


  <button
    type="submit"
    id="submitButton"
    class="submit-button"
  >
    Add Property
  </button>

</form>


<div
  id="message"
  class="message"
></div>

  </div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>

document.addEventListener(
  "DOMContentLoaded",
  function () {


    const form =
      document.getElementById("propertyForm");

    const propertyType =
      document.getElementById("propertyType");

    const price =
      document.getElementById("price");

    const priceHelp =
      document.getElementById("priceHelp");

    const submitButton =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");


    /* ===============================
       PROPERTY TYPE CHANGE
    =============================== */

    propertyType.addEventListener(
      "change",
      function () {

        if (
          propertyType.value ===
          "long_term_rental"
        ) {

          price.placeholder = "1200";

          priceHelp.textContent =
            "Long-term rentals are charged per month.";

        }

        else if (
          propertyType.value ===
          "short_term_rental"
        ) {

          price.placeholder = "150";

          priceHelp.textContent =
            "Short-term rentals are charged per night.";

        }

        else {

          price.placeholder = "150";

          priceHelp.textContent =
            "Holiday lets are charged per night.";

        }

      }
    );


    /* ===============================
       FORM SUBMISSION
    =============================== */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        message.className =
          "message";


        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          message.textContent =
            "Supabase connection error.";

          message.className =
            "message error";

          return;

        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Adding property...";


        try {


          const {
            data: {
              user
            },
            error: userError
          } =
            await supabaseClient
              .auth
              .getUser();


          if (userError) {
            throw userError;
          }


          if (!user) {

            throw new Error(
              "Please log in before adding a property."
            );

          }


          const type =
            propertyType.value;


          const propertyData = {

            owner_id:
              user.id,

            name:
              document
                .getElementById("propertyName")
                .value
                .trim(),

            location:
              document
                .getElementById("location")
                .value
                .trim(),

            currency:
              document
                .getElementById("currency")
                .value,

            bedrooms:
              Number(
                document
                  .getElementById("bedrooms")
                  .value
              ),

            bathrooms:
              Number(
                document
                  .getElementById("bathrooms")
                  .value
              ),

            max_guests:
              Number(
                document
                  .getElementById("maxGuests")
                  .value
              ),

            description:
              document
                .getElementById("description")
                .value
                .trim(),

            property_type:
              type

          };


          const rentalPrice =
            Number(price.value);


          if (
            type ===
            "long_term_rental"
          ) {

            propertyData.price_per_month =
              rentalPrice;

          }

          else {

            propertyData.price_per_night =
              rentalPrice;

          }


          const {
            error
          } =
            await supabaseClient
              .from("properties")
              .insert(propertyData);


          if (error) {
            throw error;
          }


          message.textContent =
            "Property added successfully!";


          message.className =
            "message success";


          form.reset();


          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            1500
          );


        }

        catch (error) {


          console.error(
            "ADD PROPERTY ERROR:",
            error
          );


          message.textContent =
            error.message ||
            "Unable to add property.";


          message.className =
            "message error";


        }

        finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Add Property";

        }

      }
    );


  }
);

</script></body>
  </html>
