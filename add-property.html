<h1>
  Add a Property
</h1>


<p class="intro">
  Create a listing and make it available to guests.
</p>


<form
  id="propertyForm"
  action="javascript:void(0);"
  novalidate
>


  <!-- PROPERTY TYPE -->

  <div class="form-group">

    <label for="propertyType">
      Property Type
    </label>

    <select
      id="propertyType"
      name="property_type"
      required
    >

      <option value="holiday_let">
        Holiday Let
      </option>

      <option value="short_term_rental">
        Short-Term Rental
      </option>

      <option value="long_term_rental">
        Long-Term Rental
      </option>

    </select>

  </div>


  <!-- PROPERTY NAME -->

  <div class="form-group">

    <label for="propertyName">
      Property Name
    </label>

    <input
      type="text"
      id="propertyName"
      name="property_name"
      placeholder="e.g. Luxury Lakeside Villa"
      autocomplete="off"
      required
    >

  </div>


  <!-- LOCATION -->

  <div class="form-group">

    <label for="location">
      Location
    </label>

    <input
      type="text"
      id="location"
      name="location"
      placeholder="City, Country"
      autocomplete="off"
      required
    >

  </div>


  <!-- PRICE -->

  <div class="two-column">


    <div class="form-group">

      <label for="price">
        Rental Price
      </label>

      <input
        type="number"
        id="price"
        name="price"
        min="0"
        step="0.01"
        placeholder="150"
        inputmode="decimal"
        required
      >

      <div
        id="priceHelp"
        class="price-help"
      >
        Holiday lets are charged per night.
      </div>

    </div>


    <div class="form-group">

      <label for="currency">
        Currency
      </label>

      <select
        id="currency"
        name="currency"
        required
      >

        <option value="GBP">
          GBP (£) — British Pound
        </option>

        <option value="USD">
          USD ($) — US Dollar
        </option>

        <option value="EUR">
          EUR (€) — Euro
        </option>

        <option value="CAD">
          CAD (CA$) — Canadian Dollar
        </option>

        <option value="AUD">
          AUD (A$) — Australian Dollar
        </option>

        <option value="NZD">
          NZD (NZ$) — New Zealand Dollar
        </option>

        <option value="CHF">
          CHF — Swiss Franc
        </option>

        <option value="ZAR">
          ZAR (R) — South African Rand
        </option>

        <option value="KES">
          KES (KSh) — Kenyan Shilling
        </option>

      </select>

    </div>


  </div>


  <!-- PROPERTY DETAILS -->

  <div class="three-column">


    <div class="form-group">

      <label for="bedrooms">
        Bedrooms
      </label>

      <input
        type="number"
        id="bedrooms"
        name="bedrooms"
        min="0"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="bathrooms">
        Bathrooms
      </label>

      <input
        type="number"
        id="bathrooms"
        name="bathrooms"
        min="0"
        step="0.5"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="maxGuests">
        Maximum Guests
      </label>

      <input
        type="number"
        id="maxGuests"
        name="max_guests"
        min="1"
        value="2"
        required
      >

    </div>


  </div>


  <!-- DESCRIPTION -->

  <div class="form-group">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      name="description"
      placeholder="Describe the property, amenities, location and anything guests should know..."
      required
    ></textarea>

  </div>


  <button
    type="submit"
    id="submitButton"
    class="submit-button"
  >
    Add Property
  </button>


</form>


<div
  id="message"
  class="message"
></div>


<div
  id="debugBox"
  class="debug-box"
></div>

  </div></main><!-- IMPORTANT: LOAD YOUR EXISTING SUPABASE FILE --><script src="supabase.js"></script><script>


/* ==================================================
   ELEMENTS
================================================== */

const form =
  document.getElementById("propertyForm");

const typeSelect =
  document.getElementById("propertyType");

const priceInput =
  document.getElementById("price");

const priceHelp =
  document.getElementById("priceHelp");

const submitButton =
  document.getElementById("submitButton");

const message =
  document.getElementById("message");



/* ==================================================
   PREVENT ACCIDENTAL NAVIGATION
================================================== */

document.addEventListener(
  "click",
  function(event) {

    const target =
      event.target.closest(
        "input, select, textarea, button"
      );

    if (target) {

      event.stopPropagation();

    }

  },
  true
);



/* ==================================================
   PROPERTY TYPE
================================================== */

typeSelect.addEventListener(
  "change",
  function(event) {

    event.stopPropagation();

    const type =
      typeSelect.value;

    if (
      type === "long_term_rental"
    ) {

      priceInput.placeholder =
        "1200";

      priceHelp.textContent =
        "Long-term rentals are charged per month.";

    }

    else if (
      type === "short_term_rental"
    ) {

      priceInput.placeholder =
        "150";

      priceHelp.textContent =
        "Short-term rentals are charged per night.";

    }

    else {

      priceInput.placeholder =
        "150";

      priceHelp.textContent =
        "Holiday lets are charged per night.";

    }

  }
);



/* ==================================================
   FORM SUBMIT
================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();

    message.className =
      "message";

    message.textContent =
      "";

    submitButton.disabled =
      true;

    submitButton.textContent =
      "Adding property...";


    try {


      /* CHECK SUPABASE */

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "supabaseClient is not available. Check supabase.js."
        );

      }


      /* CHECK USER */

      const {
        data,
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {

        throw userError;

      }


      const user =
        data.user;


      if (!user) {

        throw new Error(
          "You must be logged in before adding a property."
        );

      }


      /* VALUES */

      const propertyType =
        typeSelect.value;

      const name =
        document
          .getElementById("propertyName")
          .value
          .trim();

      const location =
        document
          .getElementById("location")
          .value
          .trim();

      const price =
        Number(
          priceInput.value
        );

      const currency =
        document
          .getElementById("currency")
          .value;

      const bedrooms =
        Number(
          document
            .getElementById("bedrooms")
            .value
        );

      const bathrooms =
        Number(
          document
            .getElementById("bathrooms")
            .value
        );

      const maxGuests =
        Number(
          document
            .getElementById("maxGuests")
            .value
        );

      const description =
        document
          .getElementById("description")
          .value
          .trim();


      /* VALIDATION */

      if (!name) {

        throw new Error(
          "Please enter the property name."
        );

      }

      if (!location) {

        throw new Error(
          "Please enter the location."
        );

      }

      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        throw new Error(
          "Please enter a valid rental price."
        );

      }

      if (
        bedrooms < 0
      ) {

        throw new Error(
          "Bedrooms cannot be negative."
        );

      }

      if (
        bathrooms < 0
      ) {

        throw new Error(
          "Bathrooms cannot be negative."
        );

      }

      if (
        maxGuests < 1
      ) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }

      if (!description) {

        throw new Error(
          "Please enter a property description."
        );

      }


      /* DATABASE OBJECT */

      const propertyData = {

        owner_id:
          user.id,

        name:
          name,

        location:
          location,

        currency:
          currency,

        bedrooms:
          bedrooms,

        bathrooms:
          bathrooms,

        max_guests:
          maxGuests,

        description:
          description,

        property_type:
          propertyType

      };


      if (
        propertyType ===
        "long_term_rental"
      ) {

        propertyData.price_per_month =
          price;

      }

      else {

        propertyData.price_per_night =
          price;

      }


      /* INSERT */

      const {
        error
      } =
        await supabaseClient
          .from("properties")
          .insert(propertyData);


      if (error) {

        throw error;

      }


      /* SUCCESS */

      message.textContent =
        "Property added successfully.";

      message.className =
        "message success";


      form.reset();


      typeSelect.value =
        "holiday_let";

      document
        .getElementById("currency")
        .value =
        "GBP";


      priceHelp.textContent =
        "Holiday lets are charged per night.";


      /*
        DO NOT immediately redirect.

        This is intentional so we can verify
        the page itself is working.
      */

      submitButton.textContent =
        "Property Added ✓";


    }


    catch (error) {

      console.error(
        "ADD PROPERTY ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.className =
        "message error";


      submitButton.textContent =
        "Add Property";

    }


    finally {

      submitButton.disabled =
        false;

    }

  }
);


/* ==================================================
   INITIAL
================================================== */

priceHelp.textContent =
  "Holiday lets are charged per night.";


</script></body>
                   </html>
