<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Property | StayHaven</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .page {
      max-width: 850px;
      margin: 50px auto;
      padding: 20px;
    }

    .form-card {
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      padding: 30px;
    }

    .form-card h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .field {
      margin-bottom: 5px;
    }

    .help {
      font-size: 12px;
      color: #667085;
      margin-top: 5px;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      min-height: 20px;
      font-size: 14px;
    }

    .back {
      margin-top: 20px;
      text-align: center;
    }

    .back a {
      color: #667085;
      text-decoration: none;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .page {
        margin: 25px auto;
      }

      .form-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="properties.html">Holiday Lets</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

</header>


<main class="page">

  <section class="form-card">

    <p class="eyebrow">
      PROPERTY LISTING
    </p>

    <h1>
      Add your property
    </h1>

    <p class="intro">
      List your holiday property and start receiving booking requests from guests.
    </p>


    <form id="propertyForm">

      <div class="form-grid">


        <!-- PROPERTY NAME -->

        <div class="field full">

          <label for="name">
            Property Name
          </label>

          <input
            type="text"
            id="name"
            placeholder="e.g. Lakeview Holiday Cottage"
            required
          >

        </div>


        <!-- COUNTRY -->

        <div class="field">

          <label for="country">
            Country
          </label>

          <select id="country" required>

            <option value="">
              Select country
            </option>

            <option value="United Kingdom">
              🇬🇧 United Kingdom
            </option>

            <option value="Canada">
              🇨🇦 Canada
            </option>

            <option value="United States">
              🇺🇸 United States
            </option>

            <option value="Australia">
              🇦🇺 Australia
            </option>

            <option value="France">
              🇫🇷 France
            </option>

            <option value="Spain">
              🇪🇸 Spain
            </option>

            <option value="Germany">
              🇩🇪 Germany
            </option>

            <option value="Italy">
              🇮🇹 Italy
            </option>

            <option value="Portugal">
              🇵🇹 Portugal
            </option>

            <option value="Other">
              🌎 Other
            </option>

          </select>

        </div>


        <!-- CITY -->

        <div class="field">

          <label for="city">
            City / Town
          </label>

          <input
            type="text"
            id="city"
            placeholder="e.g. Toronto"
            required
          >

        </div>


        <!-- LOCATION -->

        <div class="field full">

          <label for="location">
            Area / Location
          </label>

          <input
            type="text"
            id="location"
            placeholder="e.g. Near Lake Ontario"
          >

        </div>


        <!-- DESCRIPTION -->

        <div class="field full">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Describe your property, amenities and surroundings..."
          ></textarea>

        </div>


        <!-- GUESTS -->

        <div class="field">

          <label for="maxGuests">
            Maximum Guests
          </label>

          <input
            type="number"
            id="maxGuests"
            min="1"
            value="6"
            required
          >

        </div>


        <!-- BEDROOMS -->

        <div class="field">

          <label for="bedrooms">
            Bedrooms
          </label>

          <input
            type="number"
            id="bedrooms"
            min="0"
            value="3"
            required
          >

        </div>


        <!-- BATHROOMS -->

        <div class="field">

          <label for="bathrooms">
            Bathrooms
          </label>

          <input
            type="number"
            id="bathrooms"
            min="0"
            step="0.5"
            value="2"
            required
          >

        </div>


        <!-- PRICE -->

        <div class="field">

          <label for="price">
            Price per Night
          </label>

          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="250"
            required
          >

          <div class="help">
            Enter the amount in your selected currency.
          </div>

        </div>


        <!-- CURRENCY -->

        <div class="field">

          <label for="currency">
            Currency
          </label>

          <select id="currency" required>

            <option value="GBP">
              GBP — £
            </option>

            <option value="CAD">
              CAD — C$
            </option>

            <option value="USD">
              USD — $
            </option>

            <option value="AUD">
              AUD — A$
            </option>

            <option value="EUR">
              EUR — €
            </option>

          </select>

        </div>


        <!-- CLEANING FEE -->

        <div class="field">

          <label for="cleaningFee">
            Cleaning Fee
          </label>

          <input
            type="number"
            id="cleaningFee"
            min="0"
            step="0.01"
            value="0"
          >

        </div>


        <!-- MINIMUM STAY -->

        <div class="field">

          <label for="minimumStay">
            Minimum Stay
          </label>

          <input
            type="number"
            id="minimumStay"
            min="1"
            value="1"
            required
          >

          <div class="help">
            Minimum number of nights guests can book.
          </div>

        </div>


      </div>


      <button
        type="submit"
        class="submit-button"
        id="submitButton"
      >
        Add Property
      </button>


      <p id="message"></p>

    </form>


    <div class="back">

      <a href="dashboard.html">
        ← Back to dashboard
      </a>

    </div>

  </section>

</main>


<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("propertyForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


/* ================================
   REQUIRE LOGIN
================================ */


async function checkUser() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    window.location.href =
      "login.html";

    return null;

  }


  return user;

}


/* ================================
   CREATE PROPERTY
================================ */


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const user =
      await checkUser();


    if (!user) {

      return;

    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const country =
      document
        .getElementById("country")
        .value;


    const city =
      document
        .getElementById("city")
        .value
        .trim();


    const location =
      document
        .getElementById("location")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const maxGuests =
      Number(
        document
          .getElementById("maxGuests")
          .value
      );


    const bedrooms =
      Number(
        document
          .getElementById("bedrooms")
          .value
      );


    const bathrooms =
      Number(
        document
          .getElementById("bathrooms")
          .value
      );


    const price =
      Number(
        document
          .getElementById("price")
          .value
      );


    const currency =
      document
        .getElementById("currency")
        .value;


    const cleaningFee =
      Number(
        document
          .getElementById("cleaningFee")
          .value
      );


    const minimumStay =
      Number(
        document
          .getElementById("minimumStay")
          .value
      );


    if (price < 0) {

      message.textContent =
        "Price cannot be negative.";

      message.style.color =
        "red";

      return;

    }


    if (minimumStay < 1) {

      message.textContent =
        "Minimum stay must be at least 1 night.";

      message.style.color =
        "red";

      return;

    }


    message.textContent =
      "Adding property...";

    message.style.color =
      "#667085";


    submitButton.disabled =
      true;


    try {

      const {
        error
      } = await supabaseClient

        .from("properties")

        .insert({

          owner_id:
            user.id,

          name:
            name,

          country:
            country,

          city:
            city,

          location:
            location || null,

          description:
            description || null,

          max_guests:
            maxGuests,

          bedrooms:
            bedrooms,

          bathrooms:
            bathrooms,

          price_per_night:
            price,

          currency:
            currency,

          cleaning_fee:
            cleaningFee,

          minimum_stay:
            minimumStay

        });


      if (error) {

        throw error;

      }


      message.textContent =
        "Property added successfully!";

      message.style.color =
        "green";


      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(error);


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.style.color =
        "red";


      submitButton.disabled =
        false;

    }

  }
);


/* Check login when page opens */

checkUser();

</script>

</body>
  </html>
