<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Property | StayHaven</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #f8f8f8;
    }

    .form-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .form-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 30px;
    }

    .form-card h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .photo-upload {
      border: 2px dashed #d0d5dd;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
      background: #fafafa;
    }

    .photo-upload input {
      margin-top: 15px;
      width: 100%;
    }

    .photo-help {
      color: #667085;
      font-size: 13px;
      margin-top: 8px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .preview-card {
      position: relative;
      border-radius: 9px;
      overflow: hidden;
      background: #eee;
      aspect-ratio: 1 / 1;
    }

    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .remove-photo {
      position: absolute;
      right: 8px;
      top: 8px;
      border: 0;
      background: rgba(180, 35, 24, .9);
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
    }

    .submit-button {
      width: 100%;
      border: 0;
      background: #b88945;
      color: white;
      padding: 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      margin-top: 10px;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 650px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .preview-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-card {
        padding: 20px;
      }
    }
  </style>
</head>


<body>


<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>

    <a href="index.html">Home</a>

    <a href="owner-dashboard.html">Dashboard</a>

  </nav>

</header>


<main class="form-page">

  <a
    href="owner-dashboard.html"
    class="back-link"
  >
    ← Back to Dashboard
  </a>


  <div class="form-card">

    <p class="eyebrow">
      PROPERTY LISTING
    </p>

    <h1>
      Add Holiday Property
    </h1>

    <p class="intro">
      Add your property details and photos so guests can discover your holiday let.
    </p>


    <form id="propertyForm">


      <div class="form-group">

        <label for="propertyName">
          Property Name
        </label>

        <input
          type="text"
          id="propertyName"
          placeholder="e.g. Luxury Lakeside Cottage"
          required
        >

      </div>


      <div class="form-group">

        <label for="location">
          Location
        </label>

        <input
          type="text"
          id="location"
          placeholder="e.g. Windermere, UK"
          required
        >

      </div>


      <div class="form-group">

        <label for="description">
          Property Description
        </label>

        <textarea
          id="description"
          placeholder="Describe your property, amenities, surroundings and what makes it special..."
          required
        ></textarea>

      </div>


      <div class="form-row">


        <div class="form-group">

          <label for="price">
            Price Per Night
          </label>

          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="150"
            required
          >

        </div>


        <div class="form-group">

          <label for="maxGuests">
            Maximum Guests
          </label>

          <input
            type="number"
            id="maxGuests"
            min="1"
            placeholder="6"
            required
          >

        </div>


      </div>


      <div class="form-row">


        <div class="form-group">

          <label for="bedrooms">
            Bedrooms
          </label>

          <input
            type="number"
            id="bedrooms"
            min="0"
            placeholder="3"
            required
          >

        </div>


        <div class="form-group">

          <label for="bathrooms">
            Bathrooms
          </label>

          <input
            type="number"
            id="bathrooms"
            min="0"
            step="0.5"
            placeholder="2"
            required
          >

        </div>


      </div>


      <div class="form-group">

        <label>
          Property Photos
        </label>


        <div class="photo-upload">

          <strong>
            Upload photos
          </strong>

          <div class="photo-help">
            Select multiple photos. The first photo will be used as the cover photo.
          </div>


          <input
            type="file"
            id="photos"
            accept="image/jpeg,image/png,image/webp"
            multiple
          >

        </div>


        <div
          id="previewGrid"
          class="preview-grid"
        ></div>

      </div>


      <button
        type="submit"
        id="submitButton"
        class="submit-button"
      >
        Add Property
      </button>


    </form>


    <div
      id="message"
      class="message"
    ></div>


  </div>

</main>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://hbuoucmdgtwryahlnjzf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OqqklL691qHVkDvkZisQ5w_IhepZwCb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const propertyForm =
  document.getElementById(
    "propertyForm"
  );

const photoInput =
  document.getElementById(
    "photos"
  );

const previewGrid =
  document.getElementById(
    "previewGrid"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* ==================================================
   SELECTED PHOTOS
================================================== */

let selectedFiles = [];


/* ==================================================
   CHECK LOGIN
================================================== */

async function checkLogin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    window.location.href =
      "login.html";

    return null;

  }


  return user;

}


/* ==================================================
   PHOTO SELECTION
================================================== */

photoInput.addEventListener(
  "change",
  function() {

    const files =
      Array.from(
        photoInput.files
      );


    selectedFiles =
      selectedFiles.concat(
        files
      );


    renderPreviews();

    photoInput.value = "";

  }
);


/* ==================================================
   RENDER PREVIEWS
================================================== */

function renderPreviews() {

  previewGrid.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {

      const url =
        URL.createObjectURL(
          file
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "preview-card";


      card.innerHTML = `

        <img
          src="${url}"
          alt="Property photo"
        >

        ${
          index === 0

            ? `

              <span
                class="cover-badge"
              >
                COVER PHOTO
              </span>

            `

            : ""
        }

        <button
          type="button"
          class="remove-photo"
          data-index="${index}"
        >
          ×
        </button>

      `;


      previewGrid.appendChild(
        card
      );


      card
        .querySelector(
          ".remove-photo"
        )
        .addEventListener(
          "click",
          function() {

            selectedFiles.splice(
              index,
              1
            );

            renderPreviews();

          }
        );

    }
  );

}


/* ==================================================
   SHOW MESSAGE
================================================== */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}


/* ==================================================
   UPLOAD PHOTOS
================================================== */

async function uploadPhotos(
  propertyId,
  userId
) {

  const uploadedPhotos = [];


  for (
    let i = 0;
    i < selectedFiles.length;
    i++
  ) {

    const file =
      selectedFiles[i];


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      `${crypto.randomUUID()}.${extension}`;


    const filePath =
      `${userId}/${propertyId}/${fileName}`;


    const {
      error: uploadError
    } =
      await supabaseClient.storage
        .from("property-photos")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      throw new Error(
        "Photo upload failed: " +
        uploadError.message
      );

    }


    const {
      data: publicUrlData
    } =
      supabaseClient.storage
        .from("property-photos")
        .getPublicUrl(
          filePath
        );


    const imageUrl =
      publicUrlData.publicUrl;


    const {
      error: imageInsertError
    } =
      await supabaseClient
        .from("property_images")
        .insert({

          property_id:
            propertyId,

          image_url:
            imageUrl,

          is_cover:
            i === 0

        });


    if (imageInsertError) {

      throw new Error(
        "Photo record failed: " +
        imageInsertError.message
      );

    }


    uploadedPhotos.push(
      imageUrl
    );

  }


  return uploadedPhotos;

}


/* ==================================================
   CREATE PROPERTY
================================================== */

propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    submitButton.disabled =
      true;

    submitButton.textContent =
      "Creating property...";


    message.className =
      "message";


    try {


      /* LOGIN */

      const user =
        await checkLogin();


      if (!user) {

        return;

      }


      /* VALUES */

      const name =
        document
          .getElementById(
            "propertyName"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "location"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById(
              "price"
            )
            .value
        );


      const maxGuests =
        Number(
          document
            .getElementById(
              "maxGuests"
            )
            .value
        );


      const bedrooms =
        Number(
          document
            .getElementById(
              "bedrooms"
            )
            .value
        );


      const bathrooms =
        Number(
          document
            .getElementById(
              "bathrooms"
            )
            .value
        );


      /* VALIDATION */

      if (!name) {

        throw new Error(
          "Please enter a property name."
        );

      }


      if (!location) {

        throw new Error(
          "Please enter the property location."
        );

      }


      if (price < 0) {

        throw new Error(
          "Price cannot be negative."
        );

      }


      if (maxGuests < 1) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }


      /* CREATE PROPERTY */

      submitButton.textContent =
        "Saving property...";


      const {
        data: property,
        error: propertyError
      } =
        await supabaseClient
          .from("properties")
          .insert({

            owner_id:
              user.id,

            name:
              name,

            location:
              location,

            description:
              description,

            price_per_night:
              price,

            max_guests:
              maxGuests,

            bedrooms:
              bedrooms,

            bathrooms:
              bathrooms

          })
          .select()
          .single();


      if (propertyError) {

        throw new Error(
          "Property creation failed: " +
          propertyError.message
        );

      }


      /* UPLOAD PHOTOS */

      if (
        selectedFiles.length > 0
      ) {

        submitButton.textContent =
          "Uploading photos...";


        await uploadPhotos(
          property.id,
          user.id
        );

      }


      /* SUCCESS */

      showMessage(
        "Property added successfully!",
        "success"
      );


      propertyForm.reset();

      selectedFiles = [];

      renderPreviews();


      submitButton.textContent =
        "Property Added ✓";


      /* REDIRECT */

      setTimeout(
        function() {

          window.location.href =
            "owner-dashboard.html";

        },
        1200
      );


    }

    catch (error) {

      console.error(
        error
      );


      showMessage(
        error.message,
        "error"
      );


      submitButton.disabled =
        false;

      submitButton.textContent =
        "Add Property";

    }

  }
);


/* ==================================================
   INITIAL LOGIN CHECK
================================================== */

checkLogin();

</script>


</body>

          </html>
