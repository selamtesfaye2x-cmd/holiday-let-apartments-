  </a>  <div class="form-card"><p class="eyebrow">
  PROPERTY LISTING
</p>


<h1>
  Add a Property
</h1>


<p class="intro">
  Create a listing and make it available to guests.
</p>


<form id="propertyForm">


  <!-- PROPERTY TYPE -->

  <div class="form-group">

    <label for="propertyType">
      Property Type
    </label>

    <select
      id="propertyType"
      required
    >

      <option value="holiday_let">
        Holiday Let
      </option>

      <option value="short_term_rental">
        Short-Term Rental
      </option>

      <option value="long_term_rental">
        Long-Term Rental
      </option>

    </select>

  </div>


  <!-- PROPERTY NAME -->

  <div class="form-group">

    <label for="propertyName">
      Property Name
    </label>

    <input
      type="text"
      id="propertyName"
      placeholder="e.g. Luxury Lakeside Villa"
      required
    >

  </div>


  <!-- LOCATION -->

  <div class="form-group">

    <label for="location">
      Location
    </label>

    <input
      type="text"
      id="location"
      placeholder="City, Country"
      required
    >

  </div>


  <!-- PRICE + CURRENCY -->

  <div class="two-column">


    <div class="form-group">

      <label
        for="price"
        id="priceLabel"
      >
        Price per Night
      </label>

      <input
        type="number"
        id="price"
        min="0"
        step="0.01"
        placeholder="150"
        required
      >

    </div>


    <div class="form-group">

      <label for="currency">
        Currency
      </label>

      <select
        id="currency"
        required
      >

        <option value="GBP">
          GBP (£) — British Pound
        </option>

        <option value="CAD">
          CAD (CA$) — Canadian Dollar
        </option>

        <option value="USD">
          USD ($) — US Dollar
        </option>

        <option value="EUR">
          EUR (€) — Euro
        </option>

        <option value="AUD">
          AUD (A$) — Australian Dollar
        </option>

        <option value="NZD">
          NZD (NZ$) — New Zealand Dollar
        </option>

        <option value="CHF">
          CHF (CHF) — Swiss Franc
        </option>

        <option value="ZAR">
          ZAR (R) — South African Rand
        </option>

        <option value="KES">
          KES (KSh) — Kenyan Shilling
        </option>

      </select>

    </div>


  </div>


  <!-- PROPERTY DETAILS -->

  <div class="three-column">


    <div class="form-group">

      <label for="bedrooms">
        Bedrooms
      </label>

      <input
        type="number"
        id="bedrooms"
        min="0"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="bathrooms">
        Bathrooms
      </label>

      <input
        type="number"
        id="bathrooms"
        min="0"
        step="0.5"
        value="1"
        required
      >

    </div>


    <div class="form-group">

      <label for="maxGuests">
        Maximum Guests
      </label>

      <input
        type="number"
        id="maxGuests"
        min="1"
        value="2"
        required
      >

    </div>


  </div>


  <!-- DESCRIPTION -->

  <div class="form-group">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      placeholder="Describe the property, amenities, location and anything guests should know..."
      required
    ></textarea>

  </div>


  <button
    type="submit"
    id="submitButton"
    class="submit-button"
  >
    Add Property
  </button>


</form>


<div
  id="message"
  class="message"
></div>

  </div></main><script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://hbuoucmdgtwryahlnjzf.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_OqqklL691qHVkDvkZisQ5w_IhepZwCb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const propertyForm =
  document.getElementById(
    "propertyForm"
  );


const propertyTypeSelect =
  document.getElementById(
    "propertyType"
  );


const priceLabel =
  document.getElementById(
    "priceLabel"
  );


const priceInput =
  document.getElementById(
    "price"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* ==================================================
   UPDATE PRICE LABEL
================================================== */

function updatePriceLabel() {

  const propertyType =
    propertyTypeSelect.value;


  if (
    propertyType ===
    "long_term_rental"
  ) {

    priceLabel.textContent =
      "Price per Month";


    priceInput.placeholder =
      "1500";

  }

  else {

    priceLabel.textContent =
      "Price per Night";


    priceInput.placeholder =
      "150";

  }

}


/* RUN WHEN TYPE CHANGES */

propertyTypeSelect.addEventListener(
  "change",
  updatePriceLabel
);


/* INITIAL LABEL */

updatePriceLabel();


/* ==================================================
   SUBMIT
================================================== */

propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    submitButton.disabled =
      true;


    submitButton.textContent =
      "Adding property...";


    message.className =
      "message";


    try {


      /* USER */

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {

        throw userError;

      }


      if (!user) {

        throw new Error(
          "You must be logged in to add a property."
        );

      }


      /* FORM VALUES */

      const propertyType =
        propertyTypeSelect.value;


      const name =
        document
          .getElementById(
            "propertyName"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "location"
          )
          .value
          .trim();


      const price =
        Number(
          priceInput.value
        );


      const currency =
        document
          .getElementById(
            "currency"
          )
          .value;


      const bedrooms =
        Number(
          document
            .getElementById(
              "bedrooms"
            )
            .value
        );


      const bathrooms =
        Number(
          document
            .getElementById(
              "bathrooms"
            )
            .value
        );


      const maxGuests =
        Number(
          document
            .getElementById(
              "maxGuests"
            )
            .value
        );


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      /* VALIDATION */

      if (
        !name ||
        !location ||
        !description
      ) {

        throw new Error(
          "Please complete all required fields."
        );

      }


      if (
        Number.isNaN(price) ||
        price < 0
      ) {

        throw new Error(
          "Please enter a valid price."
        );

      }


      if (bedrooms < 0) {

        throw new Error(
          "Bedrooms cannot be negative."
        );

      }


      if (bathrooms < 0) {

        throw new Error(
          "Bathrooms cannot be negative."
        );

      }


      if (maxGuests < 1) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }


      /* ==============================================
         PROPERTY DATA
      ============================================== */

      const propertyData = {

        owner_id:
          user.id,

        name:
          name,

        location:
          location,

        currency:
          currency,

        bedrooms:
          bedrooms,

        bathrooms:
          bathrooms,

        max_guests:
          maxGuests,

        description:
          description,

        property_type:
          propertyType

      };


      /* ==============================================
         SAVE CORRECT PRICE
      ============================================== */

      if (
        propertyType ===
        "long_term_rental"
      ) {

        propertyData.price_per_month =
          price;


        /*
          Clear nightly price
        */

        propertyData.price_per_night =
          null;

      }

      else {

        propertyData.price_per_night =
          price;


        /*
          Clear monthly price
        */

        propertyData.price_per_month =
          null;

      }


      /* ==============================================
         INSERT
      ============================================== */

      const {
        data: property,
        error
      } =
        await supabaseClient

          .from("properties")

          .insert(
            propertyData
          )

          .select()

          .single();


      if (error) {

        throw error;

      }


      /* SUCCESS */

      message.textContent =
        "Property added successfully!";


      message.className =
        "message success";


      propertyForm.reset();


      propertyTypeSelect.value =
        "holiday_let";


      document
        .getElementById(
          "currency"
        )
        .value =
        "GBP";


      updatePriceLabel();


      /* REDIRECT */

      setTimeout(
        function() {

          window.location.href =
            "owner-dashboard.html";

        },
        1200
      );


    }


    catch (error) {

      console.error(
        "ADD PROPERTY ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to add property.";


      message.className =
        "message error";

    }


    finally {

      submitButton.disabled =
        false;


      submitButton.textContent =
        "Add Property";

    }

  }
);


</script></body></html>
