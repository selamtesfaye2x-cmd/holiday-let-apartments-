<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Property | StayHaven</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    body {
      background: #f8f8f8;
    }

    .form-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .form-card {
      background: white;
      padding: 35px;
      border-radius: 15px;
      border: 1px solid #eeeeee;
    }

    .form-card h1 {
      margin-bottom: 8px;
    }

    .form-intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .upload-box {
      border: 2px dashed #d0d5dd;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-top: 10px;
    }

    .upload-box input {
      margin-top: 12px;
    }

    .upload-help {
      color: #667085;
      font-size: 13px;
      margin-top: 8px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #f2f2f2;
    }

    .preview-item.cover {
      border-color: #b88945;
    }

    .preview-item img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .preview-controls {
      padding: 8px;
      background: white;
      text-align: center;
    }

    .cover-button {
      border: 0;
      background: #f2f2f2;
      padding: 7px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .preview-item.cover .cover-button {
      background: #b88945;
      color: white;
    }

    .remove-button {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .submit-button {
      width: 100%;
      border: 0;
      background: #172033;
      color: white;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .cover-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-top: 5px;
    }

    @media (max-width: 700px) {

      .form-card {
        padding: 22px;
      }

      .form-row,
      .form-row-3 {
        grid-template-columns: 1fr;
      }

      .preview-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>

</head>


<body>


<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="dashboard.html">
      Dashboard
    </a>

  </nav>

</header>



<main class="form-container">


  <div class="form-card">


    <p class="eyebrow">
      OWNER DASHBOARD
    </p>


    <h1>
      Add Your Property
    </h1>


    <p class="form-intro">

      Create your holiday-let listing and
      upload photos to showcase your property.

    </p>



    <form id="propertyForm">


      <!-- PROPERTY NAME -->

      <div class="form-group">

        <label for="name">
          Property Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="e.g. Luxury Lakeside Cottage"
          required
        >

      </div>



      <!-- LOCATION -->

      <div class="form-row">


        <div class="form-group">

          <label for="city">
            City / Town
          </label>

          <input
            type="text"
            id="city"
            placeholder="e.g. Nairobi"
            required
          >

        </div>


        <div class="form-group">

          <label for="country">
            Country
          </label>

          <input
            type="text"
            id="country"
            placeholder="e.g. Kenya"
            required
          >

        </div>


      </div>



      <!-- DESCRIPTION -->

      <div class="form-group">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Describe your property, amenities and what makes it special..."
          required
        ></textarea>

      </div>



      <!-- PROPERTY DETAILS -->

      <div class="form-row-3">


        <div class="form-group">

          <label for="maxGuests">
            Maximum Guests
          </label>

          <input
            type="number"
            id="maxGuests"
            min="1"
            value="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="bedrooms">
            Bedrooms
          </label>

          <input
            type="number"
            id="bedrooms"
            min="0"
            value="3"
            required
          >

        </div>


        <div class="form-group">

          <label for="bathrooms">
            Bathrooms
          </label>

          <input
            type="number"
            id="bathrooms"
            min="0"
            value="2"
            required
          >

        </div>


      </div>



      <!-- PRICE -->

      <div class="form-row">


        <div class="form-group">

          <label for="currency">
            Currency
          </label>

          <select id="currency">

            <option value="GBP">
              GBP — £ British Pound
            </option>

            <option value="CAD">
              CAD — C$ Canadian Dollar
            </option>

            <option value="USD">
              USD — $ US Dollar
            </option>

            <option value="EUR">
              EUR — € Euro
            </option>

            <option value="AUD">
              AUD — A$ Australian Dollar
            </option>

            <option value="NZD">
              NZD — NZ$ New Zealand Dollar
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="price">
            Price Per Night
          </label>

          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            value="150"
            required
          >

        </div>


      </div>



      <!-- PHOTOS -->

      <div class="form-group">


        <label>
          Property Photos
        </label>


        <div class="upload-box">


          <strong>
            Upload your property photos
          </strong>


          <br>


          <input
            type="file"
            id="photos"
            accept="image/*"
            multiple
          >


          <p class="upload-help">

            You can select multiple photos.
            Choose one as the cover photo.

          </p>


        </div>


        <div
          id="previewGrid"
          class="preview-grid"
        ></div>


      </div>



      <!-- SUBMIT -->

      <button
        type="submit"
        id="submitButton"
        class="submit-button"
      >

        Add Property

      </button>


    </form>



    <div
      id="message"
      class="message"
    ></div>


  </div>


</main>



<!-- SUPABASE -->

<script src="supabase.js"></script>



<script>


/* ========================================
   VARIABLES
======================================== */

const form =
  document.getElementById(
    "propertyForm"
  );


const photosInput =
  document.getElementById(
    "photos"
  );


const previewGrid =
  document.getElementById(
    "previewGrid"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


let selectedFiles = [];

let coverIndex = 0;



/* ========================================
   CHECK LOGIN
======================================== */

async function checkLogin() {


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getUser();


  if (
    error ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  return data.user;

}



/* ========================================
   PHOTO SELECTION
======================================== */

photosInput
  .addEventListener(
    "change",
    function(event) {


      const files =
        Array.from(
          event.target.files
        );


      selectedFiles =
        selectedFiles.concat(
          files
        );


      if (
        selectedFiles.length > 0 &&
        coverIndex >= selectedFiles.length
      ) {

        coverIndex = 0;

      }


      renderPreviews();


      photosInput.value = "";

    }
  );



/* ========================================
   RENDER PHOTO PREVIEWS
======================================== */

function renderPreviews() {


  previewGrid.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {


      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview-item" +
        (
          index === coverIndex
            ? " cover"
            : ""
        );


      item.innerHTML = `

        <img
          src="${url}"
          alt="Property photo"
        >

        <button
          type="button"
          class="remove-button"
          data-index="${index}"
        >
          ×
        </button>

        <div class="preview-controls">

          <button
            type="button"
            class="cover-button"
            data-cover="${index}"
          >

            ${
              index === coverIndex
                ? "★ Cover Photo"
                : "Make Cover"
            }

          </button>

        </div>

      `;


      previewGrid.appendChild(
        item
      );


      item
        .querySelector(
          ".remove-button"
        )
        .addEventListener(
          "click",
          function() {

            selectedFiles.splice(
              index,
              1
            );


            if (
              selectedFiles.length === 0
            ) {

              coverIndex = 0;

            } else if (
              coverIndex === index
            ) {

              coverIndex = 0;

            } else if (
              coverIndex > index
            ) {

              coverIndex--;

            }


            renderPreviews();

          }
        );


      item
        .querySelector(
          ".cover-button"
        )
        .addEventListener(
          "click",
          function() {

            coverIndex =
              index;

            renderPreviews();

          }
        );


    }
  );

}



/* ========================================
   SHOW MESSAGE
======================================== */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}



/* ========================================
   UPLOAD PHOTO
======================================== */

async function uploadPhoto(
  file,
  propertyId
) {


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =

    propertyId +
    "/" +
    crypto.randomUUID() +
    "." +
    extension;



  const {
    error
  } =
    await supabaseClient
      .storage
      .from("property-images")
      .upload(
        fileName,
        file,
        {
          cacheControl:
            "3600",
          upsert:
            false
        }
      );



  if (error) {

    throw error;

  }



  const {
    data
  } =
    supabaseClient
      .storage
      .from("property-images")
      .getPublicUrl(
        fileName
      );



  return data.publicUrl;

}



/* ========================================
   SUBMIT PROPERTY
======================================== */

form.addEventListener(
  "submit",
  async function(event) {


    event.preventDefault();


    submitButton.disabled =
      true;


    submitButton.textContent =
      "Creating property...";


    message.className =
      "message";


    try {


      /* LOGIN */

      const user =
        await checkLogin();


      if (!user) {

        return;

      }



      /* ==================================
         CREATE PROPERTY
      ================================== */

      const propertyData = {

        owner_id:
          user.id,

        name:
          document
            .getElementById(
              "name"
            )
            .value
            .trim(),

        location:
          document
            .getElementById(
              "city"
            )
            .value
            .trim() +
          ", " +
          document
            .getElementById(
              "country"
            )
            .value
            .trim(),

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim(),

        max_guests:
          Number(
            document
              .getElementById(
                "maxGuests"
              )
              .value
          ),

        bedrooms:
          Number(
            document
              .getElementById(
                "bedrooms"
              )
              .value
          ),

        bathrooms:
          Number(
            document
              .getElementById(
                "bathrooms"
              )
              .value
          ),

        price_per_night:
          Number(
            document
              .getElementById(
                "price"
              )
              .value
          )

      };



      submitButton.textContent =
        "Saving property...";



      const {

        data: property,

        error

      } =
        await supabaseClient

          .from(
            "properties"
          )

          .insert(
            propertyData
          )

          .select()

          .single();



      if (error) {

        throw error;

      }



      /* ==================================
         UPLOAD PHOTOS
      ================================== */

      if (
        selectedFiles.length > 0
      ) {


        submitButton.textContent =
          "Uploading photos...";


        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {


          const file =
            selectedFiles[i];


          const imageUrl =
            await uploadPhoto(
              file,
              property.id
            );


          const {

            error:
              imageError

          } =
            await supabaseClient

              .from(
                "property_images"
              )

              .insert({

                property_id:
                  property.id,

                image_url:
                  imageUrl,

                is_cover:
                  i === coverIndex

              });



          if (
            imageError
          ) {

            throw imageError;

          }

        }

      }



      /* ==================================
         SUCCESS
      ================================== */

      showMessage(
        "Property added successfully!",
        "success"
      );


      submitButton.textContent =
        "Property Added ✓";


      form.reset();


      selectedFiles = [];

      coverIndex = 0;


      previewGrid.innerHTML =
        "";


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        1500
      );


    }


    catch (error) {


      console.error(
        "Property error:",
        error
      );


      showMessage(
        "Unable to add property: " +
        error.message,
        "error"
      );


      submitButton.disabled =
        false;


      submitButton.textContent =
        "Add Property";

    }

  }
);


/* ========================================
   INITIAL CHECK
======================================== */

checkLogin();


</script>


</body>

  </html>
