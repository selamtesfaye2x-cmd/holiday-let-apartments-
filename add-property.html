}


/* =========================================

========================================= */

.type-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.type-button {
  width: 100%;
  min-height: 125px;
  padding: 20px;

  border-radius: 10px;

  text-align: left;
  cursor: pointer;
  font-family: inherit;
  transition: 0.2s;
}

.type-button:hover {
  border-color: #b88945;
}

.type-button.active {
  border-color: #b88945;
  background: #faf6ef;
  box-shadow: 0 0 0 1px #b88945;
}

.type-button strong {
  display: block;
  font-size: 16px;
  margin-bottom: 8px;
}

.type-button span {
  display: block;
  color: #667085;
  font-size: 12px;
  line-height: 1.5;
}


/* =========================================
   SUBMIT
========================================= */

.submit-button {
  width: 100%;
  border: 0;
  background: #b88945;
  color: white;
  padding: 15px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
}

.submit-button:hover {
  opacity: .92;
}

.submit-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* =========================================
   MESSAGE
========================================= */

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 7px;
  font-size: 14px;
}

.message.success {
  display: block;
  background: #e7f6ec;
  color: #217a3a;
}

.message.error {
  display: block;
  background: #fdecec;
  color: #b42318;
}

.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #172033;
  text-decoration: none;
  font-weight: 700;
}

.price-help {
  color: #667085;
  font-size: 12px;
  margin-top: 6px;
}


@media (max-width: 700px) {

  .two-column,
  .three-column {
    grid-template-columns: 1fr;
  }

  .type-options {
    grid-template-columns: 1fr;
  }

  .form-card {
    padding: 22px;
  }

}

</form><div
  id="message"
  class="message"
></div></div></main><script src="supabase.js"></script><script>

/* =========================================
   SELECTED PROPERTY TYPE
========================================= */

let selectedPropertyType =
  "holiday_let";


/* =========================================
   ELEMENTS
========================================= */

const propertyForm =
  document.getElementById(
    "propertyForm"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );

const message =
  document.getElementById(
    "message"
  );

const priceInput =
  document.getElementById(
    "price"
  );

const priceHelp =
  document.getElementById(
    "priceHelp"
  );


const holidayButton =
  document.getElementById(
    "holidayButton"
  );

const shortTermButton =
  document.getElementById(
    "shortTermButton"
  );

const longTermButton =
  document.getElementById(
    "longTermButton"
  );


/* =========================================
   UPDATE TYPE
========================================= */

function selectPropertyType(type) {

  selectedPropertyType =
    type;


  holidayButton.classList.remove(
    "active"
  );

  shortTermButton.classList.remove(
    "active"
  );

  longTermButton.classList.remove(
    "active"
  );


  if (
    type === "holiday_let"
  ) {

    holidayButton.classList.add(
      "active"
    );

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Holiday lets are charged per night.";

  }


  else if (
    type === "short_term_rental"
  ) {

    shortTermButton.classList.add(
      "active"
    );

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Short-term rentals are charged per night.";

  }


  else if (
    type === "long_term_rental"
  ) {

    longTermButton.classList.add(
      "active"
    );

    priceInput.placeholder =
      "1200";

    priceHelp.textContent =
      "Long-term rentals are charged per month.";

  }

}


/* =========================================
   TYPE BUTTON EVENTS
========================================= */

holidayButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();
    event.stopPropagation();

    selectPropertyType(
      "holiday_let"
    );

  }
);


shortTermButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();
    event.stopPropagation();

    selectPropertyType(
      "short_term_rental"
    );

  }
);


longTermButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();
    event.stopPropagation();

    selectPropertyType(
      "long_term_rental"
    );

  }
);


/* =========================================
   FORM SUBMIT
========================================= */

propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();


    submitButton.disabled =
      true;

    submitButton.textContent =
      "Adding property...";

    message.className =
      "message";


    try {


      /* CHECK SUPABASE */

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "Supabase is not available. Please check supabase.js."
        );

      }


      /* CURRENT USER */

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient
          .auth
          .getUser();


      if (userError) {

        throw userError;

      }


      if (!user) {

        throw new Error(
          "You must be logged in to add a property."
        );

      }


      /* VALUES */

      const name =
        document
          .getElementById(
            "propertyName"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "location"
          )
          .value
          .trim();


      const price =
        Number(
          priceInput.value
        );


      const bedrooms =
        Number(
          document
            .getElementById(
              "bedrooms"
            )
            .value
        );


      const bathrooms =
        Number(
          document
            .getElementById(
              "bathrooms"
            )
            .value
        );


      const maxGuests =
        Number(
          document
            .getElementById(
              "maxGuests"
            )
            .value
        );


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      /* VALIDATION */

      if (!name) {

        throw new Error(
          "Please enter the property name."
        );

      }


      if (!location) {

        throw new Error(
          "Please enter the location."
        );

      }


      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        throw new Error(
          "Please enter a valid rental price."
        );

      }


      if (bedrooms < 0) {

        throw new Error(
          "Bedrooms cannot be negative."
        );

      }


      if (bathrooms < 0) {

        throw new Error(
          "Bathrooms cannot be negative."
        );

      }


      if (maxGuests < 1) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }


      if (!description) {

        throw new Error(
          "Please enter a description."
        );

      }


      /* =====================================
         DATABASE RECORD
      ===================================== */

      const propertyData = {

        owner_id:
          user.id,

        name:
          name,

        location:
          location,

        currency:
          "GBP",

        bedrooms:
          bedrooms,

        bathrooms:
          bathrooms,

        max_guests:
          maxGuests,

        description:
          description,

        property_type:
          selectedPropertyType

      };


      if (
        selectedPropertyType ===
        "long_term_rental"
      ) {

        propertyData.price_per_month =
          price;

      }

      else {

        propertyData.price_per_night =
          price;

      }


      /* =====================================
         INSERT
      ===================================== */

      const {
        error
      } =
        await supabaseClient
          .from("properties")
          .insert(
            propertyData
          );


      if (error) {

        throw error;

      }


      /* =====================================
         SUCCESS
      ===================================== */

      message.textContent =
        "Property added successfully!";

      message.className =
        "message success";


      submitButton.textContent =
        "Property Added";


      /*
        Redirect ONLY after
        successful insertion.
      */

      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        1200
      );

    }


    catch (error) {

      console.error(
        "ADD PROPERTY ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.className =
        "message error";


      submitButton.disabled =
        false;

      submitButton.textContent =
        "Add Property";

    }

  });


/* =========================================
   INITIAL STATE
========================================= */

selectPropertyType(
  "holiday_let"
);

</script></body></html>
