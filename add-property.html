  class="message"

/* =========================================
   ELEMENTS
========================================= */

const propertyForm =
  document.getElementById("propertyForm");

const submitButton =
  document.getElementById("submitButton");

const message =
  document.getElementById("message");

const propertyType =
  document.getElementById("propertyType");

const priceInput =
  document.getElementById("price");

const priceHelp =
  document.getElementById("priceHelp");

const typeDescription =
  document.getElementById("typeDescription");



/* =========================================
   RENTAL TYPE BUTTONS
========================================= */

document
  .querySelectorAll(".rental-option")
  .forEach(function(button) {

    button.addEventListener(
      "click",
      function() {

        const type =
          this.dataset.type;

        propertyType.value =
          type;


        document
          .querySelectorAll(".rental-option")
          .forEach(function(option) {

            option.classList.remove(
              "selected"
            );

          });


        this.classList.add(
          "selected"
        );


        updatePriceLabel();

      }

    );

  });



/* =========================================
   UPDATE PRICE LABEL
========================================= */

function updatePriceLabel() {

  const type =
    propertyType.value;


  if (
    type === "long_term_rental"
  ) {

    priceInput.placeholder =
      "1200";

    priceHelp.textContent =
      "Long-term rentals are charged per month.";

    typeDescription.textContent =
      "Ideal for apartments, houses and other residential rentals.";

    submitButton.textContent =
      "Add Rental Property";

  }

  else if (
    type === "short_term_rental"
  ) {

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Short-term rentals are charged per night.";

    typeDescription.textContent =
      "Suitable for short stays and flexible accommodation.";

    submitButton.textContent =
      "Add Property";

  }

  else {

    priceInput.placeholder =
      "150";

    priceHelp.textContent =
      "Holiday lets are charged per night.";

    typeDescription.textContent =
      "Ideal for holiday homes, villas, cottages and vacation properties.";

    submitButton.textContent =
      "Add Property";

  }

}



/* =========================================
   FORM SUBMISSION
========================================= */

propertyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    submitButton.disabled =
      true;

    submitButton.textContent =
      "Adding property...";


    message.className =
      "message";


    try {


      /* =====================================
         CHECK SUPABASE
      ===================================== */

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "Supabase is not configured correctly. Check supabase.js."
        );

      }



      /* =====================================
         GET CURRENT USER
      ===================================== */

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {

        throw userError;

      }


      if (!user) {

        throw new Error(
          "You must be logged in to add a property."
        );

      }



      /* =====================================
         GET VALUES
      ===================================== */

      const type =
        propertyType.value;

      const name =
        document
          .getElementById("propertyName")
          .value
          .trim();

      const location =
        document
          .getElementById("location")
          .value
          .trim();

      const price =
        Number(
          priceInput.value
        );

      const currency =
        document
          .getElementById("currency")
          .value;

      const bedrooms =
        Number(
          document
            .getElementById("bedrooms")
            .value
        );

      const bathrooms =
        Number(
          document
            .getElementById("bathrooms")
            .value
        );

      const maxGuests =
        Number(
          document
            .getElementById("maxGuests")
            .value
        );

      const description =
        document
          .getElementById("description")
          .value
          .trim();



      /* =====================================
         VALIDATION
      ===================================== */

      if (!name) {

        throw new Error(
          "Please enter the property name."
        );

      }


      if (!location) {

        throw new Error(
          "Please enter the property location."
        );

      }


      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        throw new Error(
          "Please enter a valid rental price."
        );

      }


      if (bedrooms < 0) {

        throw new Error(
          "Bedrooms cannot be negative."
        );

      }


      if (bathrooms < 0) {

        throw new Error(
          "Bathrooms cannot be negative."
        );

      }


      if (maxGuests < 1) {

        throw new Error(
          "Maximum guests must be at least 1."
        );

      }



      /* =====================================
         BUILD DATABASE RECORD
      ===================================== */

      const propertyData = {

        owner_id:
          user.id,

        name:
          name,

        location:
          location,

        currency:
          currency,

        bedrooms:
          bedrooms,

        bathrooms:
          bathrooms,

        max_guests:
          maxGuests,

        description:
          description,

        property_type:
          type

      };



      /* =====================================
         PRICE FIELD
      ===================================== */

      if (
        type ===
        "long_term_rental"
      ) {

        propertyData.price_per_month =
          price;

      }

      else {

        propertyData.price_per_night =
          price;

      }



      /* =====================================
         INSERT PROPERTY
      ===================================== */

      const {
        data: property,
        error
      } =
        await supabaseClient
          .from("properties")
          .insert(propertyData)
          .select()
          .single();


      if (error) {

        throw error;

      }



      /* =====================================
         SUCCESS
      ===================================== */

      message.textContent =
        "Property added successfully! Returning to dashboard...";

      message.className =
        "message success";


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        1200
      );


    }


    catch (error) {

      console.error(
        "ADD PROPERTY ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to add property.";

      message.className =
        "message error";


      submitButton.disabled =
        false;


      updatePriceLabel();

    }

  });



/* =========================================
   INITIAL
========================================= */

updatePriceLabel();

</script></body></html>
