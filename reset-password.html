<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | StayHaven UK</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: #f8f9fb;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .auth-card h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .intro {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      min-height: 20px;
      font-size: 14px;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #b88945;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

<main class="auth-page">

  <section class="auth-card">

    <p class="eyebrow">NEW PASSWORD</p>

    <h1>Set a new password</h1>

    <p class="intro">
      Choose a strong new password for your StayHaven UK account.
    </p>


    <form id="resetPasswordForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >


      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="updateButton"
      >
        Update Password
      </button>

    </form>


    <p id="message"></p>


    <div class="back">

      <a href="login.html">
        ← Back to login
      </a>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("resetPasswordForm");

const message =
  document.getElementById("message");

const updateButton =
  document.getElementById("updateButton");


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const password =
      document
        .getElementById("password")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      message.style.color =
        "red";

      return;

    }


    message.textContent =
      "Updating password...";

    message.style.color =
      "#667085";


    updateButton.disabled =
      true;


    try {

      const {
        error
      } = await supabaseClient.auth.updateUser({

        password: password

      });


      if (error) {

        throw error;

      }


      message.textContent =
        "Password updated successfully! Redirecting to login...";

      message.style.color =
        "green";


      setTimeout(function() {

        window.location.href =
          "login.html";

      }, 2000);


    } catch (error) {

      console.error(error);


      message.textContent =
        error.message ||
        "Unable to update password. Please request a new reset link.";

      message.style.color =
        "red";


      updateButton.disabled =
        false;

    }

  }
);

</script>

</body>
      </html>
