<!DOCTYPE html><html lang="en">
<head>  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >  <title>Reset Password | StayHaven</title>  <link
    rel="stylesheet"
    href="style.css"
  >  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>

    .auth-page {
      max-width: 500px;
      margin: 70px auto;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      padding: 35px;
    }

    .auth-card h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 14px;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #b88945;
      color: white;
      padding: 15px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e7f6ec;
      color: #217a3a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #b88945;
      font-weight: 700;
    }

    @media (max-width: 600px) {

      .auth-page {
        margin: 35px auto;
      }

      .auth-card {
        padding: 25px;
      }

    }

  </style></head><body><header class="navbar">  <div class="logo">
    StayHaven
  </div>  <nav><a href="index.html">
  Home
</a>

<a href="properties.html">
  Properties
</a>

<a href="login.html">
  Login
</a>

  </nav></header><main class="auth-page">  <div class="auth-card"><p class="eyebrow">
  ACCOUNT SECURITY
</p>

<h1>
  Create a new password
</h1>

<p class="intro">
  Enter your new password below.
</p>


<form id="resetPasswordForm">


  <div class="form-group">

    <label for="password">
      New Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      autocomplete="new-password"
      minlength="6"
      required
    >

  </div>


  <div class="form-group">

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      autocomplete="new-password"
      minlength="6"
      required
    >

  </div>


  <button
    type="submit"
    id="resetButton"
    class="submit-button"
  >
    Update Password
  </button>


</form>


<div
  id="message"
  class="message"
></div>


<div class="auth-links">

  <a href="login.html">
    Back to Login
  </a>

</div>

  </div></main><script src="supabase.js"></script><script>


const resetForm =
  document.getElementById(
    "resetPasswordForm"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );


const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " + type;

}


async function checkSession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

    }


    if (
      !data ||
      !data.session
    ) {

      showMessage(
        "This password reset link is invalid or has expired. Please request a new one.",
        "error"
      );

      resetButton.disabled =
        true;

    }

  }

  catch (error) {

    console.error(
      "SESSION ERROR:",
      error
    );

  }

}


resetForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    resetButton.disabled =
      true;

    resetButton.textContent =
      "Updating...";

    message.className =
      "message";


    try {


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (
        password.length < 6
      ) {

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }


      if (
        password !==
        confirmPassword
      ) {

        throw new Error(
          "The passwords do not match."
        );

      }


      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password:
              password
          });


      if (error) {

        throw error;

      }


      showMessage(
        "Password updated successfully. You can now log in.",
        "success"
      );


      resetForm.reset();


      setTimeout(
        function() {

          window.location.href =
            "login.html";

        },
        1800
      );


    }


    catch (error) {

      console.error(
        "PASSWORD UPDATE ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Unable to update password.",
        "error"
      );


      resetButton.disabled =
        false;

      resetButton.textContent =
        "Update Password";

    }

  });


checkSession();


</script></body>
      </html>
