<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Holiday Properties | StayHaven</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .properties-page {
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }

    .page-heading {
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .page-heading p {
      color: #667085;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    .filters input,
    .filters select {
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .property-card {
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 14px;
      overflow: hidden;
    }

    .property-image {
      height: 220px;
      background:
        linear-gradient(
          rgba(20,28,43,0.08),
          rgba(20,28,43,0.08)
        ),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80")
        center / cover no-repeat;
    }

    .property-body {
      padding: 20px;
    }

    .property-body h2 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .location {
      color: #667085;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .details {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .detail {
      background: #f7f7f7;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .price {
      font-size: 20px;
      font-weight: 800;
    }

    .price span {
      color: #667085;
      font-size: 13px;
      font-weight: 400;
    }

    .view-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-weight: 700;
      box-sizing: border-box;
    }

    #status {
      text-align: center;
      color: #667085;
      padding: 30px;
    }

    @media (max-width: 900px) {
      .property-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .property-grid {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .page-heading h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">

  <div class="logo">
    StayHaven
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="properties.html">Holiday Lets</a>
    <a href="login.html">Owner Login</a>
  </nav>

</header>


<main class="properties-page">

  <section class="page-heading">

    <p class="eyebrow">
      DESTINATIONS
    </p>

    <h1>
      Find your next stay
    </h1>

    <p>
      Discover holiday properties from destinations around the world.
    </p>

  </section>


  <!-- SEARCH -->

  <section class="filters">

    <input
      type="search"
      id="search"
      placeholder="Search by property, city or location..."
    >


    <select id="countryFilter">

      <option value="">
        All countries
      </option>

      <option value="United Kingdom">
        🇬🇧 United Kingdom
      </option>

      <option value="Canada">
        🇨🇦 Canada
      </option>

      <option value="United States">
        🇺🇸 United States
      </option>

      <option value="Australia">
        🇦🇺 Australia
      </option>

      <option value="France">
        🇫🇷 France
      </option>

      <option value="Spain">
        🇪🇸 Spain
      </option>

      <option value="Germany">
        🇩🇪 Germany
      </option>

      <option value="Italy">
        🇮🇹 Italy
      </option>

      <option value="Portugal">
        🇵🇹 Portugal
      </option>

      <option value="Other">
        🌎 Other
      </option>

    </select>

  </section>


  <div id="status">
    Loading properties...
  </div>


  <section
    id="propertyGrid"
    class="property-grid"
  ></section>

</main>


<script src="supabase.js"></script>


<script>

let allProperties = [];


/* ================================
   CURRENCY SYMBOL
================================ */


function currencySymbol(currency) {

  const symbols = {

    GBP: "£",

    CAD: "C$",

    USD: "$",

    AUD: "A$",

    EUR: "€"

  };


  return symbols[currency] || currency;

}


/* ================================
   LOAD PROPERTIES
================================ */


async function loadProperties() {

  const status =
    document.getElementById("status");


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("properties")

      .select("*")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      throw error;

    }


    allProperties =
      data || [];


    renderProperties(
      allProperties
    );


  } catch (error) {

    console.error(error);


    status.textContent =
      "Unable to load properties: " +
      error.message;

  }

}


/* ================================
   RENDER
================================ */


function renderProperties(properties) {

  const grid =
    document.getElementById(
      "propertyGrid"
    );

  const status =
    document.getElementById(
      "status"
    );


  grid.innerHTML = "";


  if (!properties.length) {

    status.textContent =
      "No properties found.";

    return;

  }


  status.textContent =
    `${properties.length} ${
      properties.length === 1
        ? "property"
        : "properties"
    } available`;


  properties.forEach(
    function(property) {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "property-card";


      const symbol =
        currencySymbol(
          property.currency
        );


      const locationParts =
        [];


      if (property.city) {

        locationParts.push(
          property.city
        );

      }


      if (property.country) {

        locationParts.push(
          property.country
        );

      }


      const location =
        locationParts.join(
          ", "
        ) ||
        property.location ||
        "Location unavailable";


      card.innerHTML = `

        <div class="property-image"></div>

        <div class="property-body">

          <h2>
            ${escapeHtml(property.name)}
          </h2>

          <p class="location">
            ${escapeHtml(location)}
          </p>

          <div class="details">

            <div class="detail">
              ${property.bedrooms} bedrooms
            </div>

            <div class="detail">
              ${property.bathrooms} bathrooms
            </div>

            <div class="detail">
              Up to ${property.max_guests} guests
            </div>

          </div>

          <div class="price">

            ${symbol}${Number(
              property.price_per_night
            ).toFixed(2)}

            <span>
              / night
            </span>

          </div>

          <a
            class="view-button"
            href="property.html?id=${encodeURIComponent(property.id)}"
          >
            View Property
          </a>

        </div>

      `;


      grid.appendChild(card);

    }
  );

}


/* ================================
   SEARCH / FILTER
================================ */


function filterProperties() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const country =
    document
      .getElementById("countryFilter")
      .value;


  const filtered =
    allProperties.filter(
      function(property) {


        const searchable = (

          (property.name || "") +
          " " +
          (property.city || "") +
          " " +
          (property.country || "") +
          " " +
          (property.location || "")

        ).toLowerCase();


        const matchesSearch =
          !search ||
          searchable.includes(search);


        const matchesCountry =
          !country ||
          property.country === country;


        return (
          matchesSearch &&
          matchesCountry
        );

      }
    );


  renderProperties(
    filtered
  );

}


/* ================================
   SECURITY
================================ */


function escapeHtml(value) {

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ================================
   EVENTS
================================ */


document
  .getElementById("search")
  .addEventListener(
    "input",
    filterProperties
  );


document
  .getElementById("countryFilter")
  .addEventListener(
    "change",
    filterProperties
  );


/* START */

loadProperties();

</script>

</body>
  </html>
