function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatCurrency(
  amount,
  currency
) {

  const safeCurrency =
    currency || "GBP";


  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 0
      }
    ).format(
      Number(amount) || 0
    );

  }

  catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0)
    );

  }

}


function getRentalInfo(property) {

  const type =
    String(
      property.property_type ||
      "holiday_let"
    )
    .toLowerCase();


  if (
    type === "long_term_rental"
  ) {

    return {
      name: "Long-Term Rental",
      price:
        property.price_per_month ||
        property.price_per_night ||
        0,
      unit: "month"
    };

  }


  if (
    type === "short_term_rental"
  ) {

    return {
      name: "Short-Term Rental",
      price:
        property.price_per_night ||
        property.price_per_day ||
        0,
      unit: "night"
    };

  }


  return {
    name: "Holiday Let",
    price:
      property.price_per_night ||
      0,
    unit: "night"
  };

}


async function loadProperties() {


  const propertyGrid =
    document.getElementById(
      "propertyGrid"
    );


  try {


    if (
      typeof supabaseClient ===
      "undefined"
    ) {

      throw new Error(
        "Supabase connection is unavailable."
      );

    }


    const {
      data: properties,
      error
    } =
      await supabaseClient
        .from("properties")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    if (
      !properties ||
      properties.length === 0
    ) {

      propertyGrid.innerHTML = `

        <div class="empty-state">

          <h2>
            No properties available yet
          </h2>

          <p>
            Check back soon for new listings.
          </p>

        </div>

      `;

      return;

    }


    propertyGrid.innerHTML =
      properties
        .map(
          function(property) {


            const rental =
              getRentalInfo(
                property
              );


            const formattedPrice =
              formatCurrency(
                rental.price,
                property.currency
              );


            return `

              <article class="property-card">


                <div
                  class="property-image"
                ></div>


                <div
                  class="property-content"
                >


                  <span
                    class="property-type"
                  >

                    ${escapeHtml(
                      rental.name
                    )}

                  </span>


                  <h2>

                    ${escapeHtml(
                      property.name
                    )}

                  </h2>


                  <p
                    class="location"
                  >

                    📍 ${escapeHtml(
                      property.location
                    )}

                  </p>


                  <p
                    class="price"
                  >

                    ${escapeHtml(
                      formattedPrice
                    )}

                    / ${escapeHtml(
                      rental.unit
                    )}

                  </p>


                  <p
                    class="property-details"
                  >

                    ${escapeHtml(
                      property.bedrooms
                    )} bedrooms ·

                    ${escapeHtml(
                      property.bathrooms
                    )} bathrooms ·

                    Up to

                    ${escapeHtml(
                      property.max_guests
                    )} guests

                  </p>


                  <a
                    href="property.html?id=${encodeURIComponent(
                      property.id
                    )}"
                    class="view-button"
                  >

                    View Property

                  </a>


                </div>


              </article>

            `;

          }
        )
        .join("");


  }


  catch (error) {


    console.error(
      "PROPERTIES ERROR:",
      error
    );


    propertyGrid.innerHTML = `

      <div class="error-state">

        <strong>
          Unable to load properties.
        </strong>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


loadProperties();


</script></body>
