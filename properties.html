        font-size: 34px;
      }

    }

  </style></head><body><header class="navbar">  <div class="logo">
    StayHaven
  </div>  <nav><a href="index.html">Home</a>
<a href="properties.html">Properties</a>
<a href="login.html">Owner Login</a>

  </nav></header><main class="properties-page">  <section class="page-heading"><p class="eyebrow">
  DESTINATIONS
</p>

<h1>
  Find your next stay
</h1>

<p>
  Discover holiday lets, short-term rentals and long-term properties.
</p>

  </section>  <!-- SEARCH -->  <section class="filters"><input
  type="search"
  id="search"
  placeholder="Search by property, city or location..."
>


<select id="countryFilter">

  <option value="">
    All countries
  </option>

  <option value="United Kingdom">
    🇬🇧 United Kingdom
  </option>

  <option value="Canada">
    🇨🇦 Canada
  </option>

  <option value="United States">
    🇺🇸 United States
  </option>

  <option value="Australia">
    🇦🇺 Australia
  </option>

  <option value="France">
    🇫🇷 France
  </option>

  <option value="Spain">
    🇪🇸 Spain
  </option>

  <option value="Germany">
    🇩🇪 Germany
  </option>

  <option value="Italy">
    🇮🇹 Italy
  </option>

  <option value="Portugal">
    🇵🇹 Portugal
  </option>

  <option value="Other">
    🌎 Other
  </option>

</select>

  </section>  <div id="status">
    Loading properties...
  </div>  <section
    id="propertyGrid"
    class="property-grid"
  ></section></main><script src="supabase.js"></script><script>


let allProperties = [];


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==================================================
   FORMAT CURRENCY
================================================== */

function formatCurrency(
  amount,
  currency
) {

  const safeCurrency =
    currency || "GBP";


  try {

    return new Intl.NumberFormat(
      undefined,
      {
        style: "currency",
        currency: safeCurrency,
        maximumFractionDigits: 2
      }
    ).format(
      Number(amount) || 0
    );

  }

  catch (error) {

    return (
      safeCurrency +
      " " +
      Number(amount || 0).toFixed(2)
    );

  }

}


/* ==================================================
   GET RENTAL INFORMATION
================================================== */

function getRentalInfo(property) {

  const type =
    String(
      property.property_type ||
      "holiday_let"
    )
    .toLowerCase()
    .trim();


  /* LONG TERM */

  if (
    type === "long_term_rental" ||
    type.includes("long")
  ) {

    return {

      name:
        "Long-Term Rental",

      unit:
        "month",

      price:
        property.price_per_month ??
        property.price_per_night ??
        0

    };

  }


  /* SHORT TERM */

  if (
    type === "short_term_rental" ||
    type.includes("short")
  ) {

    return {

      name:
        "Short-Term Rental",

      unit:
        "night",

      price:
        property.price_per_night ??
        0

    };

  }


  /* HOLIDAY LET */

  return {

    name:
      "Holiday Let",

    unit:
      "night",

    price:
      property.price_per_night ??
      0

  };

}


/* ==================================================
   LOAD PROPERTIES
================================================== */

async function loadProperties() {

  const status =
    document.getElementById(
      "status"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient

        .from("properties")

        .select("*")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    allProperties =
      data || [];


    renderProperties(
      allProperties
    );

  }

  catch (error) {

    console.error(
      "LOAD PROPERTIES ERROR:",
      error
    );


    status.textContent =
      "Unable to load properties: " +
      error.message;

  }

}


/* ==================================================
   RENDER PROPERTIES
================================================== */

function renderProperties(properties) {

  const grid =
    document.getElementById(
      "propertyGrid"
    );


  const status =
    document.getElementById(
      "status"
    );


  grid.innerHTML = "";


  if (!properties.length) {

    status.textContent =
      "No properties found.";

    return;

  }


  status.textContent =
    `${properties.length} ${
      properties.length === 1
        ? "property"
        : "properties"
    } available`;


  properties.forEach(
    function(property) {


      /* RENTAL INFO */

      const rental =
        getRentalInfo(property);


      /* PRICE */

      const formattedPrice =
        formatCurrency(
          rental.price,
          property.currency
        );


      /* LOCATION */

      const locationParts =
        [];


      if (property.city) {

        locationParts.push(
          property.city
        );

      }


      if (property.country) {

        locationParts.push(
          property.country
        );

      }


      const location =
        locationParts.join(", ") ||
        property.location ||
        "Location unavailable";


      /* CARD */

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "property-card";


      card.innerHTML = `

        <div class="property-image"></div>


        <div class="property-body">


          <span class="property-type">

            ${escapeHtml(
              rental.name
            )}

          </span>


          <h2>

            ${escapeHtml(
              property.name
            )}

          </h2>


          <p class="location">

            📍 ${escapeHtml(
              location
            )}

          </p>


          <div class="details">


            <div class="detail">

              🛏️ ${escapeHtml(
                property.bedrooms ??
                "—"
              )} bedrooms

            </div>


            <div class="detail">

              🛁 ${escapeHtml(
                property.bathrooms ??
                "—"
              )} bathrooms

            </div>


            <div class="detail">

              👥 Up to ${escapeHtml(
                property.max_guests ??
                "—"
              )} guests

            </div>


          </div>


          <div class="price">

            ${escapeHtml(
              formattedPrice
            )}

            <span>

              / ${escapeHtml(
                rental.unit
              )}

            </span>

          </div>


          <a
            class="view-button"
            href="property.html?id=${encodeURIComponent(
              property.id
            )}"
          >

            View Property

          </a>


        </div>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   FILTER PROPERTIES
================================================== */

function filterProperties() {


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


  const country =
    document
      .getElementById(
        "countryFilter"
      )
      .value;


  const filtered =
    allProperties.filter(
      function(property) {


        const searchable = (

          (property.name || "") +
          " " +

          (property.city || "") +
          " " +

          (property.country || "") +
          " " +

          (property.location || "")

        )
        .toLowerCase();


        const matchesSearch =
          !search ||
          searchable.includes(
            search
          );


        const matchesCountry =
          !country ||
          property.country ===
          country;


        return (

          matchesSearch &&
          matchesCountry

        );

      }
    );


  renderProperties(
    filtered
  );

}


/* ==================================================
   EVENTS
================================================== */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    filterProperties
  );


document
  .getElementById(
    "countryFilter"
  )
  .addEventListener(
    "change",
    filterProperties
  );


/* ==================================================
   START
================================================== */

loadProperties();


</script></body></html>
